<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#080912;
  color:white;
}

#game{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#33205e,transparent 40%),
    linear-gradient(#11152b,#070811);
}

/* TIÊU ĐỀ */

.title{
  position:absolute;
  top:8px;
  width:100%;
  text-align:center;
  font-size:20px;
  font-weight:900;
  z-index:20;
}

/* THANH HP */

.bars{
  position:absolute;
  top:42px;
  left:4%;
  width:92%;
  display:flex;
  gap:15px;
  z-index:20;
}

.status{
  width:50%;
}

.name{
  font-size:13px;
  font-weight:bold;
  margin-bottom:4px;
}

.hp,.rage{
  height:15px;
  border:2px solid #555;
  background:#242536;
  border-radius:20px;
  overflow:hidden;
}

.hpFill{
  width:100%;
  height:100%;
  background:#e53935;
  transition:.15s;
}

.rage{
  height:9px;
  margin-top:4px;
}

.rageFill{
  width:0%;
  height:100%;
  background:#a348ff;
  transition:.15s;
}

/* THÔNG BÁO */

#message{
  position:absolute;
  top:92px;
  width:100%;
  text-align:center;
  font-size:16px;
  font-weight:bold;
  z-index:20;
}

/* SÂN */

.arena{
  position:absolute;
  left:0;
  right:0;
  top:115px;
  bottom:155px;
  overflow:hidden;
}

.floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:23%;
  background:linear-gradient(#393747,#171721);
  border-top:4px solid #555268;
}

/* NHÂN VẬT */

.fighter{
  position:absolute;
  width:70px;
  height:130px;
  bottom:22%;
  transition:left .08s,transform .08s;
  z-index:10;
}

#player{
  left:18%;
}

#enemy{
  left:72%;
  transform:scaleX(-1);
}

.head{
  position:absolute;
  width:45px;
  height:45px;
  left:13px;
  top:0;
  border-radius:50%;
  background:#ffd0a6;
  border:3px solid #111;
}

.body{
  position:absolute;
  width:55px;
  height:60px;
  left:8px;
  top:40px;
  border-radius:16px;
  background:#2677ff;
  border:3px solid #111;
}

.enemyBody{
  background:#e23752;
}

.arm{
  position:absolute;
  width:17px;
  height:52px;
  top:45px;
  background:#ffd0a6;
  border:3px solid #111;
  border-radius:15px;
}

.arm.left{
  left:-4px;
  transform:rotate(25deg);
}

.arm.right{
  right:-4px;
  transform:rotate(-25deg);
}

.leg{
  position:absolute;
  width:19px;
  height:52px;
  top:95px;
  background:#222;
  border:3px solid #111;
  border-radius:12px;
}

.leg.left{
  left:12px;
}

.leg.right{
  right:12px;
}

/* BIẾN DỊ */

.mutated .head{
  background:#baff70;
  box-shadow:0 0 20px #70ff35;
}

.mutated .body{
  background:#8b35ff;
  box-shadow:0 0 25px #a64cff;
  transform:scale(1.15);
}

.mutated .arm,
.mutated .leg{
  box-shadow:0 0 15px #a64cff;
}

.mutated::after{
  content:"BIẾN DỊ";
  position:absolute;
  top:-30px;
  left:-20px;
  width:110px;
  text-align:center;
  color:#d994ff;
  font-weight:900;
}

/* ĐIỀU KHIỂN */

.controls{
  position:absolute;
  bottom:10px;
  left:0;
  width:100%;
  height:135px;
  z-index:50;
}

.move{
  position:absolute;
  left:10px;
  bottom:5px;
  display:flex;
  gap:8px;
}

.actions{
  position:absolute;
  right:10px;
  bottom:5px;
  display:flex;
  gap:7px;
}

button{
  border:0;
  color:white;
  font-weight:900;
  border-radius:16px;
  height:58px;
  min-width:58px;
  background:#292a3d;
  box-shadow:0 5px 0 #11121c;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #11121c;
}

.leftBtn,.rightBtn{
  font-size:25px;
  background:#303452;
}

.jump{
  font-size:20px;
  background:#276aa5;
}

.punch{
  background:#b52c39;
}

.kick{
  background:#c86a22;
}

.guard{
  background:#286ba8;
}

.mutate{
  background:#7639c9;
}

/* NÚT BIẾN DỊ */

.mutate.ready{
  animation:pulse .7s infinite alternate;
}

@keyframes pulse{
  from{box-shadow:0 0 5px #9d4cff;}
  to{box-shadow:0 0 25px #c276ff;}
}

/* KẾT QUẢ */

#overlay{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,.8);
  z-index:100;
}

#result{
  font-size:34px;
  font-weight:900;
  margin-bottom:20px;
}

.restart{
  width:180px;
  background:#783bce;
}

/* MOBILE */

@media(max-width:500px){

  .title{
    font-size:17px;
  }

  .bars{
    top:40px;
  }

  .arena{
    top:105px;
    bottom:155px;
  }

  .fighter{
    transform:scale(.85);
  }

  #enemy{
    transform:scaleX(-1) scale(.85);
  }

  button{
    min-width:53px;
    height:55px;
    font-size:11px;
  }

  .leftBtn,.rightBtn{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="title">⚔️ ĐẤU TRƯỜNG BIẾN DỊ</div>

  <div class="bars">

    <div class="status">
      <div class="name">🧍 CHIẾN BINH</div>

      <div class="hp">
        <div id="playerHP" class="hpFill"></div>
      </div>

      <div class="rage">
        <div id="playerRage" class="rageFill"></div>
      </div>
    </div>

    <div class="status">
      <div class="name" style="text-align:right">
        BOSS 🤖
      </div>

      <div class="hp">
        <div id="enemyHP" class="hpFill"></div>
      </div>

      <div class="rage">
        <div id="enemyRage" class="rageFill"></div>
      </div>
    </div>

  </div>

  <div id="message">
    🔥 Tiến lên!
  </div>

  <div class="arena">

    <div id="player" class="fighter">

      <div class="head"></div>
      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

    </div>

    <div id="enemy" class="fighter">

      <div class="head"></div>
      <div class="body enemyBody"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

    </div>

    <div class="floor"></div>

  </div>

  <!-- ĐIỀU KHIỂN -->

  <div class="controls">

    <div class="move">

      <button
        class="leftBtn"
        ontouchstart="moveLeftStart()"
        ontouchend="moveStop()"
        onmousedown="moveLeftStart()"
        onmouseup="moveStop()">
        ◀
      </button>

      <button
        class="rightBtn"
        ontouchstart="moveRightStart()"
        ontouchend="moveStop()"
        onmousedown="moveRightStart()"
        onmouseup="moveStop()">
        ▶
      </button>

      <button
        class="jump"
        onclick="jump()">
        ⬆️
      </button>

    </div>

    <div class="actions">

      <button
        class="punch"
        onclick="attack()">
        👊
      </button>

      <button
        class="kick"
        onclick="kick()">
        🦵
      </button>

      <button
        class="guard"
        onclick="guard()">
        🛡️
      </button>

      <button
        id="mutateBtn"
        class="mutate"
        onclick="mutate()">
        🧬
      </button>

    </div>

  </div>

  <div id="overlay">

    <div id="result"></div>

    <button
      class="restart"
      onclick="restartGame()">
      🔄 CHƠI LẠI
    </button>

  </div>

</div>

<script>

/* =========================
   BIẾN GAME
========================= */

let playerHP = 100;
let enemyHP = 100;

let playerRage = 0;
let enemyRage = 0;

let playerX = 18;
let enemyX = 72;

let moveDirection = 0;

let guarding = false;
let jumping = false;

let playerMutated = false;
let enemyMutated = false;

let gameOver = false;

let playerMutationTimer = null;
let enemyMutationTimer = null;


/* =========================
   CẬP NHẬT
========================= */

function update(){

  playerHP = Math.max(0,playerHP);
  enemyHP = Math.max(0,enemyHP);

  playerRage = Math.min(100,playerRage);
  enemyRage = Math.min(100,enemyRage);

  document.getElementById("playerHP").style.width =
    playerHP + "%";

  document.getElementById("enemyHP").style.width =
    enemyHP + "%";

  document.getElementById("playerRage").style.width =
    playerRage + "%";

  document.getElementById("enemyRage").style.width =
    enemyRage + "%";

  document.getElementById("player").style.left =
    playerX + "%";

  document.getElementById("enemy").style.left =
    enemyX + "%";

  const btn =
    document.getElementById("mutateBtn");

  if(playerRage >= 100){
    btn.classList.add("ready");
  }else{
    btn.classList.remove("ready");
  }
}


function say(text){

  document.getElementById("message")
    .textContent = text;

}


/* =========================
   DI CHUYỂN
========================= */

function moveLeftStart(){

  if(gameOver) return;

  moveDirection = -1;

}


function moveRightStart(){

  if(gameOver) return;

  moveDirection = 1;

}


function moveStop(){

  moveDirection = 0;

}


setInterval(()=>{

  if(gameOver) return;

  if(moveDirection !== 0){

    playerX += moveDirection * 1.2;

    playerX =
      Math.max(3,Math.min(82,playerX));

    update();

  }

},30);


/* =========================
   NHẢY
========================= */

function jump(){

  if(gameOver || jumping) return;

  jumping = true;

  const p =
    document.getElementById("player");

  p.style.bottom = "48%";

  setTimeout(()=>{

    p.style.bottom = "22%";

    jumping = false;

  },450);

}


/* =========================
   KHOẢNG CÁCH
========================= */

function distance(){

  return Math.abs(playerX - enemyX);

}


/* =========================
   ĐÁNH
========================= */

function attack(){

  if(gameOver) return;

  if(distance() > 18){

    say("💨 Quá xa!");

    return;

  }

  let damage =
    playerMutated ? 18 : 10;

  enemyHP -= damage;

  playerRage =
    Math.min(100,playerRage + 15);

  say("👊 Đấm trúng!");

  update();

  checkWin();

}


function kick(){

  if(gameOver) return;

  if(distance() > 20){

    say("💨 Không đủ gần!");

    return;

  }

  let damage =
    playerMutated ? 26 : 15;

  enemyHP -= damage;

  playerRage =
    Math.min(100,playerRage + 20);

  say("🦵 Đá trúng!");

  update();

  checkWin();

}


/* =========================
   ĐỠ
========================= */

function guard(){

  if(gameOver) return;

  guarding = true;

  say("🛡️ Đang đỡ!");

  setTimeout(()=>{

    guarding = false;

  },900);

}


/* =========================
   BOSS AI
========================= */

function bossAI(){

  if(gameOver) return;

  const d = distance();

  /* Boss tiến lại */

  if(d > 15){

    if(enemyX > playerX){
      enemyX -= .7;
    }else{
      enemyX += .7;
    }

    enemyX =
      Math.max(5,Math.min(82,enemyX));

    update();

    return;
  }

  /* Boss đánh */

  if(Math.random() < .65){

    let damage =
      enemyMutated ? 18 : 9;

    if(guarding){

      damage =
        Math.floor(damage * .25);

      say("🛡️ Bạn chặn đòn Boss!");

    }else{

      say("💥 Boss tấn công!");

    }

    playerHP -= damage;

    enemyRage =
      Math.min(100,enemyRage + 14);

    update();

    checkWin();

  }

}


setInterval(bossAI,650);


/* =========================
   BIẾN DỊ NGƯỜI CHƠI
========================= */

function mutate(){

  if(gameOver) return;

  if(playerRage < 100){

    say("🧬 NỘI chưa đầy!");

    return;

  }

  if(playerMutated){

    say("🔥 Đang biến dị!");

    return;

  }

  playerRage = 0;

  playerMutated = true;

  document.getElementById("player")
    .classList.add("mutated");

  say("🧬 BIẾN DỊ KÍCH HOẠT!");

  update();

  clearTimeout(playerMutationTimer);

  playerMutationTimer =
    setTimeout(()=>{

      playerMutated = false;

      document.getElementById("player")
        .classList.remove("mutated");

      say("↩️ Biến dị kết thúc!");

      update();

    },8000);

}


/* =========================
   BOSS BIẾN DỊ
========================= */

function enemyMutate(){

  if(enemyRage < 100) return;

  if(enemyMutated) return;

  enemyRage = 0;

  enemyMutated = true;

  document.getElementById("enemy")
    .classList.add("mutated");

  say("⚠️ BOSS ĐÃ BIẾN DỊ!");

  update();

  clearTimeout(enemyMutationTimer);

  enemyMutationTimer =
    setTimeout(()=>{

      enemyMutated = false;

      document.getElementById("enemy")
        .classList.remove("mutated");

      say("Boss trở lại bình thường!");

      update();

    },8000);

}


setInterval(()=>{

  if(gameOver) return;

  if(enemyRage >= 100){

    enemyMutate();

  }

},500);


/* =========================
   THẮNG / THUA
========================= */

function checkWin(){

  if(playerHP <= 0){

    playerHP = 0;

    endGame("💀 THẤT BẠI");

    return;

  }

  if(enemyHP <= 0){

    enemyHP = 0;

    endGame("🏆 CHIẾN THẮNG!");

  }

  update();

}


function endGame(text){

  gameOver = true;

  moveDirection = 0;

  document.getElementById("result")
    .textContent = text;

  document.getElementById("overlay")
    .style.display = "flex";

}


/* =========================
   CHƠI LẠI
========================= */

function restartGame(){

  playerHP = 100;
  enemyHP = 100;

  playerRage = 0;
  enemyRage = 0;

  playerX = 18;
  enemyX = 72;

  moveDirection = 0;

  guarding = false;
  jumping = false;

  playerMutated = false;
  enemyMutated = false;

  gameOver = false;

  clearTimeout(playerMutationTimer);
  clearTimeout(enemyMutationTimer);

  document.getElementById("player")
    .classList.remove("mutated");

  document.getElementById("enemy")
    .classList.remove("mutated");

  document.getElementById("overlay")
    .style.display = "none";

  say("🔥 Tiến lên!");

  update();

}


/* =========================
   BẮT ĐẦU
========================= */

update();

</script>

</body>
  </html>

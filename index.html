<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05050b;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* =========================
   UI
========================= */

#top{
  position:absolute;
  top:8px;
  left:0;
  width:100%;
  z-index:20;
  pointer-events:none;
}

.title{
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:900;
  text-shadow:0 2px 5px #000;
  letter-spacing:2px;
}

.bars{
  width:92%;
  margin:7px auto 0;
  display:flex;
  gap:14px;
}

.barbox{
  width:50%;
}

.label{
  color:white;
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px;
  text-shadow:0 2px 4px #000;
}

.hp{
  height:15px;
  background:#252532;
  border:2px solid #77778c;
  border-radius:20px;
  overflow:hidden;
}

.hp i{
  display:block;
  width:100%;
  height:100%;
  background:#ed343c;
  transition:.15s;
}

.rage{
  height:8px;
  margin-top:4px;
  background:#20202c;
  border:1px solid #66667b;
  border-radius:20px;
  overflow:hidden;
}

.rage i{
  display:block;
  width:0%;
  height:100%;
  background:#a83cff;
}

#message{
  margin-top:6px;
  text-align:center;
  color:white;
  font-size:14px;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:9px;
  height:125px;
  z-index:30;
}

.leftControls{
  position:absolute;
  left:10px;
  bottom:5px;
  display:flex;
  gap:7px;
}

.rightControls{
  position:absolute;
  right:10px;
  bottom:5px;
  display:flex;
  gap:7px;
}

button{
  width:57px;
  height:57px;
  border:0;
  border-radius:17px;
  color:white;
  font-size:20px;
  font-weight:900;
  background:#303247;
  box-shadow:0 5px 0 #11121b;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #11121b;
}

.attack{
  background:#c52d3e;
}

.skill{
  background:#7435c7;
}

.power{
  background:#a84921;
}

.mutate{
  background:#8038d4;
}

.jump{
  background:#2774ac;
}

.ready{
  animation:pulse .6s infinite alternate;
}

@keyframes pulse{
  from{
    box-shadow:0 0 5px #9e42ff;
  }
  to{
    box-shadow:0 0 25px #d274ff;
  }
}

/* =========================
   RESULT
========================= */

#resultScreen{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.78);
  z-index:100;
}

#result{
  color:white;
  font-size:34px;
  font-weight:900;
  text-align:center;
  margin-bottom:20px;
}

.restart{
  width:190px;
  background:#7836c9;
  font-size:16px;
}

/* nhỏ hơn */
@media(max-width:500px){

  .title{
    font-size:17px;
  }

  button{
    width:50px;
    height:53px;
    font-size:17px;
  }

  .bars{
    width:94%;
  }
}
</style>
</head>

<body>

<div id="game">

<div id="top">

  <div class="title">
    ⚡ ĐẤU TRƯỜNG BIẾN DỊ
  </div>

  <div class="bars">

    <div class="barbox">
      <div class="label">⚡ KẺ TỐC ĐỘ</div>

      <div class="hp">
        <i id="playerHP"></i>
      </div>

      <div class="rage">
        <i id="playerRage"></i>
      </div>
    </div>

    <div class="barbox">

      <div class="label" style="text-align:right">
        ☠ BOSS
      </div>

      <div class="hp">
        <i id="enemyHP"></i>
      </div>

      <div class="rage">
        <i id="enemyRage"></i>
      </div>

    </div>

  </div>

  <div id="message">
    ⚡ Kẻ Tốc Độ bước vào đấu trường!
  </div>

</div>


<div id="controls">

  <div class="leftControls">

    <button
      ontouchstart="move(-1)"
      ontouchend="stopMove()"
      onmousedown="move(-1)"
      onmouseup="stopMove()">
      ◀
    </button>

    <button
      ontouchstart="move(1)"
      ontouchend="stopMove()"
      onmousedown="move(1)"
      onmouseup="stopMove()">
      ▶
    </button>

    <button
      class="jump"
      onclick="jump()">
      ⬆️
    </button>

  </div>


  <div class="rightControls">

    <button
      class="attack"
      onclick="attack()">
      👊
    </button>

    <button
      class="skill"
      onclick="dash()">
      💨
    </button>

    <button
      class="skill"
      onclick="afterImage()">
      ⚡
    </button>

    <button
      class="power"
      onclick="breakSpeed()">
      💥
    </button>

    <button
      id="mutateButton"
      class="mutate"
      onclick="mutate()">
      🧬
    </button>

  </div>

</div>


<div id="resultScreen">

  <div id="result"></div>

  <button
    class="restart"
    onclick="restartGame()">
    🔄 CHƠI LẠI
  </button>

</div>

</div>


<!-- THREE.JS -->

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

/* =========================================
   GAME
========================================= */

let bossGroup;

let playerY=0;
let bossY=0;

let moveDirection=0;

let jumping=false;

let playerMutated=false;
let bossMutated=false;

let gameOver=false;

let lastTime=performance.now();

let hitStopUntil=0;


/* =========================================
   INITIALIZE
========================================= */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x080a18);

  scene.fog=
    new THREE.Fog(0x080a18,15,32);


  /* CAMERA */

  camera=
    new THREE.OrthographicCamera(
      -7,7,
      4.2,-4.2,
      .1,100
    );

  camera.position.set(0,3.3,15);

  camera.lookAt(0,2,0);


  /* RENDERER */

  renderer=
    new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:"high-performance"
    });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled=true;

  document
    .getElementById("game")
    .prepend(renderer.domElement);


  /* LIGHT */

  const ambient=
    new THREE.HemisphereLight(
      0x9999ff,
      0x161622,
      2.2
    );

  scene.add(ambient);


  const light=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light.position.set(-4,8,10);

  light.castShadow=true;

  scene.add(light);


  /* ARENA */

  createArena();


  /* CHARACTERS */

  playerGroup=
    createSpeedCharacter(false);

  playerGroup.position.set(
    playerX,
    0,
    0
  );

  scene.add(playerGroup);


  bossGroup=
    createSpeedCharacter(true);

  bossGroup.position.set(
    bossX,
    0,
    0
  );

  bossGroup.scale.x=-1;

  scene.add(bossGroup);


  window.addEventListener(
    "resize",
    resize
  );


  updateUI();

  requestAnimationFrame(loop);
}


/* =========================================
   ARENA
========================================= */

function createArena(){

  const floorMat=
    new THREE.MeshStandardMaterial({
      color:0x292a39,
      roughness:.8
    });

  const floor=
    new THREE.Mesh(
      new THREE.BoxGeometry(18,.5,5),
      floorMat
    );

  floor.position.y=-.3;

  floor.receiveShadow=true;

  scene.add(floor);


  /* BACK WALL */

  const wallMat=
    new THREE.MeshStandardMaterial({
      color:0x15162b
    });

  const wall=
    new THREE.Mesh(
      new THREE.BoxGeometry(20,9,.5),
      wallMat
    );

  wall.position.set(0,3,-2.5);

  scene.add(wall);


  /* LIGHT CIRCLES */

  for(let i=-2;i<=2;i++){

    const ring=
      new THREE.Mesh(
        new THREE.TorusGeometry(
          1.5,
          .025,
          8,
          40
        ),
        new THREE.MeshBasicMaterial({
          color:0x7439b8,
          transparent:true,
          opacity:.35
        })
      );

    ring.rotation.x=Math.PI/2;

    ring.position.set(
      i*3,
      .01,
      -1
    );

    scene.add(ring);
  }
}

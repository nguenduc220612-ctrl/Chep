<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEP AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  height:100%;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#050816;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 10%,#392080 0,transparent 30%),
    radial-gradient(circle at 90% 80%,#075985 0,transparent 30%),
    #050816;
}

.app{
  width:100%;
  max-width:720px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:rgba(8,13,30,.88);
  backdrop-filter:blur(18px);
  box-shadow:0 0 60px #000;
}

/* HEADER */

.header{
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid #27345c;
  background:rgba(10,15,35,.9);
}

.logo{
  width:56px;
  height:56px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:900;

  background:linear-gradient(
    135deg,
    #8b5cf6,
    #06b6d4
  );

  box-shadow:
    0 0 15px #7c3aed,
    0 0 35px rgba(6,182,212,.45);

  animation:pulse 2s infinite;
}

.header h1{
  margin:0;
  font-size:23px;
  letter-spacing:2px;
}

.status{
  margin-top:3px;
  color:#67e8f9;
  font-size:12px;
}

/* CHAT */

.chat{
  flex:1;
  overflow:auto;
  padding:20px;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(59,130,246,.10),
      transparent 45%
    );
}

.msg{
  max-width:85%;
  padding:13px 16px;
  margin:11px 0;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;

  animation:appear .25s ease;
}

.msg.user{
  margin-left:auto;
}

.msg.bot{
  margin-right:auto;
}

.bubble{
  padding:0;
}

.bot .bubble{
  background:linear-gradient(
    135deg,
    #18233d,
    #111a30
  );

  border:1px solid #30456f;
  padding:13px 16px;
  border-radius:20px;
  border-bottom-left-radius:6px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.25);
}

.user .bubble{
  background:linear-gradient(
    135deg,
    #6d28d9,
    #2563eb
  );

  padding:13px 16px;
  border-radius:20px;
  border-bottom-right-radius:6px;

  box-shadow:
    0 5px 20px rgba(37,99,235,.3);
}

/* BOTTOM */

.bottom{
  padding:10px 12px 12px;

  border-top:1px solid #27345c;

  background:rgba(7,12,27,.96);
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row input{
  min-width:0;
  flex:1;

  background:#10182d;
  color:white;

  border:1px solid #33446d;
  border-radius:18px;

  padding:13px 15px;
  font-size:16px;
  outline:none;
}

.row input::placeholder{
  color:#71809e;
}

.row input:focus{
  border-color:#8b5cf6;

  box-shadow:
    0 0 15px rgba(139,92,246,.3);
}

.row button{
  border:0;
  color:white;

  min-width:52px;
  height:50px;

  border-radius:17px;

  font-size:19px;
  cursor:pointer;
}

#mic{
  background:linear-gradient(
    135deg,
    #7c3aed,
    #a855f7
  );

  box-shadow:
    0 0 15px rgba(124,58,237,.4);
}

#send{
  background:linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
  );

  font-size:22px;

  box-shadow:
    0 0 15px rgba(6,182,212,.25);
}

#mic:active,
#send:active{
  transform:scale(.92);
}

.small{
  text-align:center;
  color:#64748b;
  font-size:11px;
  padding-top:7px;
}

/* ANIMATION */

@keyframes pulse{

  0%,100%{
    box-shadow:
      0 0 15px #7c3aed,
      0 0 25px rgba(6,182,212,.3);
  }

  50%{
    box-shadow:
      0 0 30px #7c3aed,
      0 0 50px rgba(6,182,212,.5);
  }
}

@keyframes appear{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:420px){

  .header{
    padding:13px;
  }

  .logo{
    width:50px;
    height:50px;
  }

  .header h1{
    font-size:20px;
  }

  .chat{
    padding:14px;
  }

  .row button{
    min-width:48px;
  }
}
</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      C
    </div>

    <div>
      <h1>CHEP AI</h1>
      <div class="status">
        ● Đang hoạt động
      </div>
    </div>

  </div>

  <div class="chat" id="chat"></div>

  <div class="bottom">

    <div class="row">

      <button id="mic" title="Nói">
        🎙️
      </button>

      <input
        id="input"
        type="text"
        placeholder="Nói chuyện với CHEP..."
      >

      <button id="send" title="Gửi">
        ➤
      </button>

    </div>

    <div class="small">
      CHEP — trợ lý AI của bạn
    </div>

  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");


function addMessage(text,type){

  const msg = document.createElement("div");

  msg.className = "msg " + type;

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  msg.appendChild(bubble);

  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}


function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u =
      new SpeechSynthesisUtterance(text);

    u.lang = "vi-VN";

    u.rate = 1;

    speechSynthesis.speak(u);
  }
}


function chepReply(text){

  const t =
    text.toLowerCase().trim();


  if(
    t.includes("xin chào") ||
    t.includes("chào") ||
    t.includes("hello")
  ){

    return "Xin chào! Mình là CHEP 🤖. Hôm nay mình có thể nói chuyện với bạn.";
  }


  if(
    t.includes("bạn là ai") ||
    t.includes("chep là ai")
  ){

    return "Mình là CHEP AI 🤖 — một trợ lý được thiết kế để trò chuyện, nghe và nói với bạn.";
  }


  if(t.includes("tên bạn")){

    return "Tên mình là CHEP.";
  }


  if(t.includes("cảm ơn")){

    return "Không có gì 😎";
  }


  if(t.includes("bạn khỏe không")){

    return "Mình vẫn hoạt động tốt đây! 😎";
  }


  if(t.includes("roblox")){

    return "Roblox nghe thú vị đấy! Bạn có thể kể cho mình về game bạn đang làm.";
  }


  return 'CHEP đã nhận được: "' +
    text +
    '"\n\nĐây là phiên bản web của CHEP. Khi kết nối máy chủ AI, CHEP sẽ có thể trả lời thông minh hơn.';
}


function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";


  setTimeout(()=>{

    const answer =
      chepReply(text);

    addMessage(answer,"bot");

    speak(answer);

  },400);
}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);


/* MICROPHONE */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.lang = "vi-VN";

  recognition.continuous = false;

  recognition.interimResults = false;


  mic.addEventListener(
    "click",
    ()=>{

      recognition.start();

      mic.textContent = "🔴";

    }
  );


  recognition.onresult =
    event => {

      input.value =
        event.results[0][0].transcript;

      mic.textContent = "🎙️";

      sendMessage();

    };


  recognition.onerror =
    ()=>{

      mic.textContent = "🎙️";

    };


  recognition.onend =
    ()=>{

      mic.textContent = "🎙️";

    };

}else{

  mic.addEventListener(
    "click",
    ()=>{

      alert(
        "Trình duyệt này chưa hỗ trợ nhận giọng nói."
      );

    }
  );

}


/* GREETING */

addMessage(
  "Xin chào! Mình là CHEP 🤖\nBạn có thể nhắn tin hoặc bấm 🎙️ để nói chuyện với mình.",
  "bot"
);

</script>

</body>
  </html>

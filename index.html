<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070914;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#070914;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   TOP UI
========================= */

#ui{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.title{
  position:absolute;
  top:8px;
  left:0;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:21px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 8px #000;
}

.bars{
  position:absolute;
  left:4%;
  top:42px;
  width:92%;
  display:flex;
  gap:14px;
}

.box{
  width:50%;
}

.name{
  color:#fff;
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
  text-shadow:0 2px 5px #000;
}

.hp{
  height:16px;
  border:2px solid #666a7c;
  border-radius:20px;
  overflow:hidden;
  background:#222432;
}

.hp > div{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#b51f31,#ff4052);
  transition:width .12s;
}

.rage{
  margin-top:4px;
  height:9px;
  border:1px solid #65687b;
  border-radius:20px;
  overflow:hidden;
  background:#1e2030;
}

.rage > div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7622d5,#d05cff);
  transition:width .12s;
}

#message{
  position:absolute;
  top:90px;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:14px;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:125px;
  z-index:20;
  pointer-events:none;
}

.group{
  position:absolute;
  bottom:4px;
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.left{
  left:10px;
}

.right{
  right:10px;
}

button{
  width:54px;
  height:56px;
  border:0;
  border-radius:17px;
  color:#fff;
  background:#303449;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 0 #11131d;
  touch-action:none;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #11131d;
}

.moveBtn{
  background:#303952;
}

.jump{
  background:#2778b6;
}

.attack{
  background:#c52e40;
}

.skill{
  background:#7335c7;
}

.power{
  background:#ac4c20;
}

.mutate{
  background:#8439d6;
}

.mutate.ready{
  animation:pulse .6s infinite alternate;
}

@keyframes pulse{
  from{box-shadow:0 0 5px #8f38dc,0 5px 0 #11131d;}
  to{box-shadow:0 0 24px #d568ff,0 5px 0 #11131d;}
}

/* =========================
   RESULT
========================= */

#resultScreen{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.78);
  z-index:30;
}

#result{
  color:#fff;
  font-size:35px;
  font-weight:900;
  margin-bottom:20px;
  text-align:center;
  text-shadow:0 3px 10px #000;
}

.restart{
  width:190px;
  background:#7837c8;
  font-size:16px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){
  .title{
    font-size:17px;
  }

  button{
    width:49px;
    height:53px;
    font-size:17px;
  }

  .bars{
    left:3%;
    width:94%;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="ui">

  <div class="title">⚡ ĐẤU TRƯỜNG BIẾN DỊ</div>

  <div class="bars">

    <div class="box">
      <div class="name">⚡ KẺ TỐC ĐỘ</div>

      <div class="hp">
        <div id="playerHP"></div>
      </div>

      <div class="rage">
        <div id="playerRage"></div>
      </div>
    </div>

    <div class="box">
      <div class="name" style="text-align:right">☠ BOSS</div>

      <div class="hp">
        <div id="bossHP"></div>
      </div>

      <div class="rage">
        <div id="bossRage"></div>
      </div>
    </div>

  </div>

  <div id="message">
    ⚡ Kẻ Tốc Độ bước vào đấu trường!
  </div>

</div>

<div class="controls">

  <div class="group left">

    <button
      class="moveBtn"
      ontouchstart="moveLeft()"
      ontouchend="stopMove()"
      onmousedown="moveLeft()"
      onmouseup="stopMove()">
      ◀
    </button>

    <button
      class="moveBtn"
      ontouchstart="moveRight()"
      ontouchend="stopMove()"
      onmousedown="moveRight()"
      onmouseup="stopMove()">
      ▶
    </button>

    <button
      class="jump"
      onclick="jump()">
      ⬆
    </button>

  </div>

  <div class="group right">

    <button class="attack" onclick="attack()">👊</button>

    <button class="skill" onclick="dash()">💨</button>

    <button class="skill" onclick="afterImage()">⚡</button>

    <button class="power" onclick="breakSpeed()">💥</button>

    <button
      id="mutateButton"
      class="mutate"
      onclick="mutate()">
      🧬
    </button>

  </div>

</div>

<div id="resultScreen">

  <div id="result"></div>

  <button
    class="restart"
    onclick="restartGame()">
    🔄 CHƠI LẠI
  </button>

</div>

</div>


<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;


/* =========================================================
   GAME STATE
========================================================= */

let player = {
  x:-2.8,
  y:0,
  vy:0,
  hp:100,
  rage:0,
  facing:1,
  action:"",
  actionTime:0,
  mutated:false,
  jump:false,
  hitFlash:0
};

let boss = {
  x:2.8,
  y:0,
  hp:100,
  rage:0,
  facing:-1,
  action:"",
  actionTime:0,
  mutated:false,
  hitFlash:0
};

let particles = [];
let speedLines = [];

let moveDirection = 0;
let gameOver = false;
let hitStop = 0;
let shake = 0;

let last = performance.now();


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function distance(){
  return Math.abs(player.x - boss.x);
}

function say(text){
  document.getElementById(
    "message"
  ).textContent = text;
}

function rand(min,max){
  return Math.random()*(max-min)+min;
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById("playerHP")
    .style.width = player.hp + "%";

  document.getElementById("bossHP")
    .style.width = boss.hp + "%";

  document.getElementById("playerRage")
    .style.width = player.rage + "%";

  document.getElementById("bossRage")
    .style.width = boss.rage + "%";

  const btn =
    document.getElementById("mutateButton");

  if(player.rage >= 100){
    btn.classList.add("ready");
  }else{
    btn.classList.remove("ready");
  }
}


/* =========================================================
   INPUT
========================================================= */

function moveLeft(){
  if(gameOver)return;
  moveDirection = -1;
}

function moveRight(){
  if(gameOver)return;
  moveDirection = 1;
}

function stopMove(){
  moveDirection = 0;
}

function jump(){

  if(gameOver || player.jump)return;

  player.jump = true;
  player.vy = 8.8;
}


/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,count,color1,color2){

  for(let i=0;i<count;i++){

    particles.push({
      x:x,
      y:y,
      vx:rand(-4,4),
      vy:rand(-2,5),
      life:rand(.25,.55),
      max:0.55,
      size:rand(3,7),
      c:Math.random()<.5 ? color1 : color2
    });
  }
}

function addSpeedLines(x,y){

  for(let i=0;i<3;i++){

    speedLines.push({
      x:x+rand(-.5,.5),
      y:y+rand(0,1.8),
      vx:rand(-10,-6),
      life:.25
    });
  }
}


/* =========================================================
   COMBAT
========================================================= */

function hitStopNow(ms=110){

  hitStop = ms;
  shake = 9;
}


function hitBoss(damage,knockback){

  boss.hp -= damage;

  boss.rage =
    clamp(
      boss.rage + damage*.32,
      0,100
    );

  player.rage =
    clamp(
      player.rage + damage*1.25,
      0,100
    );

  boss.x += knockback;

  boss.x =
    clamp(boss.x,-6,6);

  boss.hitFlash = .18;

  burst(
    screenX(boss.x),
    screenY(boss.y+1.4),
    18,
    "#ffffff",
    "#7e43ff"
  );

  hitStopNow();

  if(boss.hp <= 0){
    boss.hp = 0;
    win();
  }

  updateUI();
}


function hitPlayer(damage,knockback){

  player.hp -= damage;

  player.x += knockback;

  player.x =
    clamp(player.x,-6,6);

  player.hitFlash = .18;

  burst(
    screenX(player.x),
    screenY(player.y+1.4),
    15,
    "#ffffff",
    "#ff3950"
  );

  hitStopNow();

  if(player.hp <= 0){
    player.hp = 0;
    lose();
  }

  updateUI();
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

  if(gameOver || player.action)return;

  player.action = "punch";
  player.actionTime = .28;

  if(distance() <= 1.9){

    setTimeout(()=>{

      if(!gameOver){
        hitBoss(
          player.mutated ? 18 : 10,
          player.facing * .45
        );

        say("👊 ĐÁNH TRÚNG!");

      }

    },95);

  }else{

    say("💨 Quá xa!");
  }
}


function dash(){

  if(gameOver || player.action)return;

  if(distance() > 5){

    say("💨 Boss quá xa!");
    return;
  }

  player.action = "dash";
  player.actionTime = .35;

  player.x =
    boss.x - player.facing*.95;

  player.x =
    clamp(player.x,-6,6);

  addSpeedLines(
    screenX(player.x),
    screenY(player.y+1)
  );

  say("💨 LƯỚT XUYÊN!");

  setTimeout(()=>{

    if(!gameOver && distance() <= 1.8){

      hitBoss(
        player.mutated ? 25 : 15,
        player.facing*.8
      );
    }

  },80);
}


function afterImage(){

  if(gameOver || player.action)return;

  if(distance() > 2.6){

    say("⚡ Hãy áp sát!");
    return;
  }

  player.action = "after";
  player.actionTime = .38;

  say("⚡ ẢNH TỐC!");

  for(let i=0;i<5;i++){

    setTimeout(()=>{

      addSpeedLines(
        screenX(player.x)-i*12,
        screenY(player.y+1)
      );

    },i*35);
  }

  setTimeout(()=>{

    if(!gameOver && distance() <= 2){

      hitBoss(
        player.mutated ? 28 : 17,
        player.facing*.5
      );
    }

  },100);
}


function breakSpeed(){

  if(gameOver || player.action)return;

  if(distance() > 2){

    say("💥 Quá xa!");
    return;
  }

  player.action = "break";
  player.actionTime = .48;

  say("💥 PHÁ TỐC!");

  setTimeout(()=>{

    if(!gameOver && distance() <= 2.2){

      hitBoss(
        player.mutated ? 40 : 25,
        player.facing*1.15
      );
    }

  },135);
}


/* =========================================================
   MUTATION
========================================================= */

function mutate(){

  if(gameOver)return;

  if(player.rage < 100){

    say("🧬 NỘI CHƯA ĐẦY!");
    return;
  }

  if(player.mutated){

    say("🔥 Đang biến dị!");
    return;
  }

  player.rage = 0;
  player.mutated = true;
  player.action = "transform";
  player.actionTime = .6;

  burst(
    screenX(player.x),
    screenY(player.y+1.4),
    45,
    "#ffffff",
    "#b348ff"
  );

  say("🧬 KẺ TỐC ĐỘ — BIẾN DỊ!");

  updateUI();

  setTimeout(()=>{

    player.action = "";

  },600);

  setTimeout(()=>{

    player.mutated = false;

    say("↩️ Biến dị kết thúc!");

  },8000);
}


/* =========================================================
   BOSS AI
========================================================= */

function bossAI(dt){

  if(gameOver)return;

  const d = distance();

  if(d > 1.75){

    const dir =
      player.x > boss.x ? 1 : -1;

    boss.x += dir * 1.5 * dt;

    boss.facing = dir;

    if(Math.random() < .18){
      addSpeedLines(
        screenX(boss.x),
        screenY(boss.y+.8)
      );
    }

    return;
  }

  boss.facing =
    player.x >= boss.x ? 1 : -1;

  if(
    !boss.action &&
    Math.random() < .018
  ){

    boss.action = "punch";
    boss.actionTime = .3;

    setTimeout(()=>{

      if(
        !gameOver &&
        distance() < 1.95
      ){

        const damage =
          boss.mutated ? 18 : 9;

        hitPlayer(
          damage,
          boss.facing*.38
        );

        say("☠️ BOSS TẤN CÔNG!");
      }

    },100);
  }

  if(boss.rage >= 100 && !boss.mutated){

    boss.rage = 0;
    boss.mutated = true;

    burst(
      screenX(boss.x),
      screenY(boss.y+1.5),
      35,
      "#ff5268",
      "#82152c"
    );

    say("☠️ BOSS ĐÃ BIẾN DỊ!");

    setTimeout(()=>{

      boss.mutated = false;

    },8000);
  }
}


/* =========================================================
   UPDATE GAME
========================================================= */

function update(dt){

  if(gameOver)return;

  if(hitStop > 0){
    hitStop -= dt*1000;
    return;
  }

  /* movement */

  if(moveDirection !== 0){

    player.x +=
      moveDirection * 3.8 * dt;

    player.x =
      clamp(player.x,-6,6);

    player.facing =
      moveDirection;

    if(!player.action){

      addSpeedLines(
        screenX(player.x),
        screenY(player.y+.8)
      );
    }
  }

  /* jump */

  if(player.jump){

    player.y += player.vy * dt;

    player.vy -= 18 * dt;

    if(player.y <= 0){

      player.y = 0;
      player.vy = 0;
      player.jump = false;
    }
  }

  /* actions */

  if(player.actionTime > 0){

    player.actionTime -= dt;

    if(player.actionTime <= 0){

      player.action = "";
    }
  }

  if(boss.actionTime > 0){

    boss.actionTime -= dt;

    if(boss.actionTime <= 0){

      boss.action = "";
    }
  }

  if(player.hitFlash > 0)
    player.hitFlash -= dt;

  if(boss.hitFlash > 0)
    boss.hitFlash -= dt;

  /* boss */

  bossAI(dt);

  /* particles */

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy -= 8*dt;
    p.life -= dt;

    if(p.life <= 0)
      particles.splice(i,1);
  }

  /* speed */

  for(let i=speedLines.length-1;i>=0;i--){

    const s = speedLines[i];

    s.x += s.vx*dt;
    s.life -= dt;

    if(s.life <= 0)
      speedLines.splice(i,1);
  }

  shake *= .86;
}


/* =========================================================
   CAMERA / WORLD
========================================================= */

function getCamera(){

  const middle =
    (player.x + boss.x) / 2;

  return middle;
}

function worldToScreen(x){

  const cam =
    getCamera();

  return (
    W*.5 +
    (x-cam)*W*.105
  );
}

function screenX(x){
  return worldToScreen(x);
}

function screenY(y){

  const ground =
    H*.70;

  return ground - y*H*.14;
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(0,"#080b18");
  sky.addColorStop(.5,"#171338");
  sky.addColorStop(1,"#05060d");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);


  /* moon glow */

  const moon =
    ctx.createRadialGradient(
      W*.5,H*.30,10,
      W*.5,H*.30,230
    );

  moon.addColorStop(0,"rgba(126,65,255,.22)");
  moon.addColorStop(1,"rgba(126,65,255,0)");

  ctx.fillStyle = moon;
  ctx.fillRect(0,0,W,H);


  /* city silhouettes */

  ctx.fillStyle = "#101125";

  for(let i=0;i<16;i++){

    const bw =
      45 + (i%4)*18;

    const bh =
      70 + (i%5)*24;

    const x =
      i*bw-20;

    ctx.fillRect(
      x,
      H*.54-bh,
      bw-7,
      bh
    );
  }


  /* lights */

  ctx.fillStyle = "rgba(120,145,255,.18)";

  for(let i=0;i<30;i++){

    const x =
      (i*83)%W;

    const y =
      H*.35 + (i%6)*24;

    ctx.fillRect(
      x,
      y,
      5,
      8
    );
  }
}


/* =========================================================
   DRAW ARENA
========================================================= */

function drawArena(){

  const groundY =
    H*.70;

  /* back platform */

  ctx.fillStyle = "#252638";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );


  /* lines */

  ctx.strokeStyle =
    "rgba(120,120,160,.12)";

  ctx.lineWidth=1;

  for(let x=-W;x<W*2;x+=55){

    ctx.beginPath();

    ctx.moveTo(x,groundY);

    ctx.lineTo(x+15,H);

    ctx.stroke();
  }


  for(let y=groundY+30;y<H;y+=38){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }


  /* floor edge */

  ctx.fillStyle = "#66677b";

  ctx.fillRect(
    0,
    groundY-5,
    W,
    5
  );


  /* center glow */

  const g =
    ctx.createRadialGradient(
      W*.5,
      groundY,
      10,
      W*.5,
      groundY,
      W*.25
    );

  g.addColorStop(0,"rgba(150,80,255,.16)");
  g.addColorStop(1,"rgba(150,80,255,0)");

  ctx.fillStyle = g;

  ctx.fillRect(
    0,
    groundY-100,
    W,
    220
  );
}


/* =========================================================
   3D-STYLE CHARACTER DRAW
========================================================= */

function drawCharacter(ch,isBoss){

  const x =
    worldToScreen(ch.x);

  const ground =
    H*.70;

  const y =
    ground -
    ch.y*H*.14;


  ctx.save();

  /* shadow */

  ctx.globalAlpha=.28;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    ground+7,
    34,
    10,
    0,0,Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* mutation aura */

  if(ch.mutated){

    const aura =
      ctx.createRadialGradient(
        x,y-52,
        8,
        x,y-52,
        75
      );

    aura.addColorStop(
      0,
      isBoss
        ? "rgba(255,40,75,.25)"
        : "rgba(173,60,255,.32)"
    );

    aura.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=aura;

    ctx.beginPath();

    ctx.arc(
      x,y-52,
      75,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  /* body scale feeling */

  let bodyW=42;
  let bodyH=65;

  if(ch.mutated){

    bodyW=48;
    bodyH=72;
  }


  /* legs */

  drawLimb(
    x-13,
    y-8,
    x-17,
    y+34,
    isBoss ? "#26202a":"#161b2c",
    12
  );

  drawLimb(
    x+13,
    y-8,
    x+17,
    y+34,
    isBoss ? "#26202a":"#161b2c",
    12
  );


  /* boots */

  drawBoot(
    x-20,
    y+31,
    isBoss
      ? "#4d1822"
      : "#1c3255"
  );

  drawBoot(
    x+20,
    y+31,
    isBoss
      ? "#4d1822"
      : "#1c3255"
  );


  /* torso */

  const torsoGrad =
    ctx.createLinearGradient(
      x-bodyW/2,
      y-76,
      x+bodyW/2,
      y-10
    );

  if(isBoss){

    torsoGrad.addColorStop(0,"#8f2138");
    torsoGrad.addColorStop(.5,"#c7354d");
    torsoGrad.addColorStop(1,"#571827");

  }else{

    torsoGrad.addColorStop(0,"#141b2d");
    torsoGrad.addColorStop(.5,"#243756");
    torsoGrad.addColorStop(1,"#0a101d");
  }

  ctx.fillStyle=torsoGrad;

  roundRect(
    ctx,
    x-bodyW/2,
    y-84,
    bodyW,
    bodyH,
    14
  );

  ctx.fill();


  /* chest */

  if(!isBoss){

    ctx.save();

    ctx.fillStyle =
      ch.mutated
        ? "#d76cff"
        : "#ffd227";

    ctx.shadowBlur =
      ch.mutated ? 18 : 8;

    ctx.shadowColor =
      ch.mutated
        ? "#ad48ff"
        : "#ffd227";

    ctx.beginPath();

    ctx.moveTo(x,y-70);
    ctx.lineTo(x+8,y-54);
    ctx.lineTo(x+2,y-54);
    ctx.lineTo(x+9,y-34);
    ctx.lineTo(x-4,y-51);
    ctx.lineTo(x+1,y-51);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }


  /* arms */

  let punchOffset=0;

  if(ch.action==="punch")
    punchOffset = 27;

  if(ch.action==="break")
    punchOffset = 34;

  if(ch.action==="dash")
    punchOffset = 18;


  drawLimb(
    x-24,
    y-70,
    x-40,
    y-34,
    isBoss ? "#d08f69":"#e7ac7c",
    13
  );

  drawLimb(
    x+24,
    y-70,
    x+40+(punchOffset*ch.facing),
    y-36,
    isBoss ? "#d08f69":"#e7ac7c",
    13
  );


  /* gloves */

  drawSphere(
    x-42,
    y-31,
    11,
    isBoss ? "#501b27":"#23385d"
  );

  drawSphere(
    x+42+(punchOffset*ch.facing),
    y-32,
    11,
    isBoss ? "#501b27":"#23385d"
  );


  /* neck */

  ctx.fillStyle =
    isBoss ? "#bb815f":"#d9996c";

  ctx.fillRect(
    x-8,
    y-96,
    16,
    13
  );


  /* head */

  const headGrad =
    ctx.createRadialGradient(
      x-8,
      y-112,
      5,
      x,
      y-104,
      30
    );

  headGrad.addColorStop(
    0,
    isBoss ? "#dcab86":"#ffd0a5"
  );

  headGrad.addColorStop(
    1,
    isBoss ? "#8f5c46":"#c47f5f"
  );

  ctx.fillStyle=headGrad;

  ctx.beginPath();

  ctx.arc(
    x,
    y-108,
    27,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  if(!isBoss){

    ctx.fillStyle =
      ch.mutated
        ? "#c35dff"
        : "#141927";

    ctx.beginPath();

    ctx.moveTo(x-27,y-111);
    ctx.lineTo(x-20,y-137);
    ctx.lineTo(x-7,y-128);
    ctx.lineTo(x+3,y-145);
    ctx.lineTo(x+10,y-127);
    ctx.lineTo(x+28,y-138);
    ctx.lineTo(x+20,y-108);
    ctx.closePath();

    ctx.fill();

  }else{

    ctx.fillStyle =
      ch.mutated ? "#7a091e":"#4d1725";

    ctx.beginPath();

    ctx.moveTo(x-27,y-111);
    ctx.quadraticCurveTo(
      x-20,y-140,
      x+4,y-132
    );

    ctx.quadraticCurveTo(
      x+21,y-140,
      x+27,y-111
    );

    ctx.closePath();

    ctx.fill();
  }


  /* face */

  ctx.fillStyle="#111";

  ctx.fillRect(
    x-15,
    y-109,
    8,
    4
  );

  ctx.fillRect(
    x+7,
    y-109,
    8,
    4
  );


  /* hit flash */

  if(ch.hitFlash > 0){

    ctx.globalAlpha =
      clamp(ch.hitFlash/.18,0,1);

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      x,
      y-74,
      53,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
  }


  /* speed effect */

  if(ch.action==="dash" ||
     ch.action==="after"){

    for(let i=0;i<5;i++){

      ctx.strokeStyle =
        isBoss
          ? "rgba(255,60,90,.35)"
          : "rgba(119,79,255,.45)";

      ctx.lineWidth=3;

      ctx.beginPath();

      const sx =
        x-ch.facing*(30+i*15);

      ctx.moveTo(
        sx,
        y-60+i*9
      );

      ctx.lineTo(
        sx-ch.facing*35,
        y-60+i*9
      );

      ctx.stroke();
    }
  }


  ctx.restore();
}


/* =========================================================
   SHAPE HELPERS
========================================================= */

function drawLimb(x1,y1,x2,y2,color,width){

  const dx=x2-x1;
  const dy=y2-y1;
  const len=Math.hypot(dx,dy);

  const ang=Math.atan2(dy,dx);

  ctx.save();

  ctx.translate(x1,y1);
  ctx.rotate(ang);

  const grad=
    ctx.createLinearGradient(
      0,-width/2,
      0,width/2
    );

  grad.addColorStop(0,"#ffffff55");
  grad.addColorStop(.25,color);
  grad.addColorStop(1,"#00000055");

  ctx.fillStyle=grad;

  roundRect(
    ctx,
    0,
    -width/2,
    len,
    width,
    width/2
  );

  ctx.fill();

  ctx.restore();
}


function drawBoot(x,y,color){

  const g=
    ctx.createLinearGradient(
      x-12,y-10,
      x+14,y+8
    );

  g.addColorStop(0,"#ffffff33");
  g.addColorStop(.35,color);
  g.addColorStop(1,"#00000088");

  ctx.fillStyle=g;

  roundRect(
    ctx,
    x-11,
    y-9,
    25,
    17,
    6
  );

  ctx.fill();
}


function drawSphere(x,y,r,color){

  const g=
    ctx.createRadialGradient(
      x-r*.4,
      y-r*.5,
      2,
      x,
      y,
      r
    );

  g.addColorStop(0,"#ffffff77");
  g.addColorStop(.25,color);
  g.addColorStop(1,"#00000099");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();
}


function roundRect(ctx,x,y,w,h,r){

  r=Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      clamp(p.life/p.max,0,1);

    ctx.fillStyle=p.c;

    ctx.beginPath();

    ctx.arc(
      screenX(p.x),
      screenY(p.y),
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;


  for(const s of speedLines){

    ctx.globalAlpha =
      clamp(s.life/.25,0,1);

    ctx.strokeStyle="#a85cff";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      worldToScreen(s.x),
      screenY(s.y)
    );

    ctx.lineTo(
      worldToScreen(s.x+.7),
      screenY(s.y)
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  ctx.save();

  if(shake > .2){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );
  }

  drawBackground();
  drawArena();

  /* fighters order by x */

  if(player.x < boss.x){

    drawCharacter(
      player,
      false
    );

    drawCharacter(
      boss,
      true
    );

  }else{

    drawCharacter(
      boss,
      true
    );

    drawCharacter(
      player,
      false
    );
  }

  drawParticles();

  ctx.restore();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  const dt =
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   WIN / LOSE
========================================================= */

function win(){

  gameOver=true;

  say("🏆 KẺ TỐC ĐỘ CHIẾN THẮNG!");

  document.getElementById(
    "result"
  ).textContent =
    "🏆 CHIẾN THẮNG!";

  document.getElementById(
    "resultScreen"
  ).style.display="flex";
}

function lose(){

  gameOver=true;

  say("💀 Bạn đã bị đánh bại!");

  document.getElementById(
    "result"
  ).textContent =
    "💀 THẤT BẠI";

  document.getElementById(
    "resultScreen"
  ).style.display="flex";
}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

  player.x=-2.8;
  player.y=0;
  player.vy=0;
  player.hp=100;
  player.rage=0;
  player.facing=1;
  player.action="";
  player.actionTime=0;
  player.mutated=false;
  player.jump=false;
  player.hitFlash=0;

  boss.x=2.8;
  boss.y=0;
  boss.hp=100;
  boss.rage=0;
  boss.facing=-1;
  boss.action="";
  boss.actionTime=0;
  boss.mutated=false;
  boss.hitFlash=0;

  particles=[];
  speedLines=[];

  gameOver=false;
  hitStop=0;
  shake=0;
  moveDirection=0;

  document.getElementById(
    "resultScreen"
  ).style.display="none";

  say("⚡ Kẻ Tốc Độ trở lại!");

  updateUI();
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft();

    if(e.key==="ArrowRight")
      moveRight();

    if(e.key==="ArrowUp")
      jump();

    if(e.key==="z")
      attack();

    if(e.key==="x")
      dash();

    if(e.key==="c")
      afterImage();

    if(e.key==="v")
      breakSpeed();

    if(e.key==="b")
      mutate();
  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight"
    ){

      stopMove();
    }
  }
);


/* =========================================================
   START
========================================================= */

updateUI();
say("⚡ Kẻ Tốc Độ bước vào đấu trường!");

</script>

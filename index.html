<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Đấu Trường Biến Dị</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#070b14}
canvas{width:100vw;height:100vh;display:block}
</style></head><body><canvas id="game"></canvas><script>
"use strict";
const c=document.getElementById("game"),x=c.getContext("2d");
let W=innerWidth,H=innerHeight,D=1,screen="menu",mode="cpu",slow=0,parts=[],menu=[];
const I={left:0,right:0,guard:0}; const U={};
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(D,0,0,D,0,0);layout()}
function layout(){let s=Math.max(58,Math.min(76,W*.075)),b=H-s-18,g=12;U.left={x:18,y:b,w:s,h:s};U.right={x:18+s+g,y:b,w:s,h:s};U.jump={x:W-3*s-2*g-18,y:b,w:s,h:s};U.guard={x:W-2*s-g-18,y:b,w:s,h:s};U.attack={x:W-s-18,y:b,w:s,h:s};U.s1={x:W-2*s-g-18,y:b-s-g,w:s,h:s};U.s2={x:W-s-18,y:b-s-g,w:s,h:s};U.mut={x:W-3*s-2*g-18,y:b-s-g,w:s,h:s}}
addEventListener("resize",size);size();
function hit(px,py,b){return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h}
function fighter(type,pos,enemy=false,boss=false){let f={type,x:pos,y:0,vx:0,vy:0,dir:enemy?-1:1,hp:boss?280:100,maxHp:boss?280:100,mutation:0,mutated:false,mt:0,guard:false,at:0,s1:0,s2:0,stun:0,flash:0,enemy,boss,speed:type=="speed"?330:270,jump:650};return f}
let player=fighter("speed",180),enemy=fighter("core",W-180,true);
function reset(){player=fighter(sel,W*.25);enemy=mode=="boss"?fighter("core",W*.75,true,true):fighter(sel=="speed"?"core":"speed",W*.75,true);parts=[]}
let sel="speed";
function ground(){return H-145}
function burst(px,py,n=15,energy=false){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=60+Math.random()*220;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,energy})}}
function hurt(f,d){if(f.guard)return false;f.hp=Math.max(0,f.hp-d);f.flash=.12;f.stun=.12;burst(f.x,ground()-70);slow=.1;return true}
function jump(){if(screen=="game"&&player.y<=.5&&player.stun<=0){player.y=1;player.vy=player.jump;burst(player.x,ground(),7,true)}}
function attack(){if(screen!="game"||player.at>0||player.stun>0)return;player.at=.38;let d=Math.abs(player.x-enemy.x);if(d<105&&Math.abs(player.y-enemy.y)<70&&hurt(enemy,player.mutated?22:12))player.mutation=Math.min(100,player.mutation+(player.mutated?7:10))}
function s1(){if(screen!="game"||player.s1>0||player.stun>0)return;player.s1=player.mutated?4.2:3;if(player.type=="speed"){player.x+=player.dir*(player.mutated?125:90);player.x=Math.max(45,Math.min(W-45,player.x));burst(player.x,ground()-60,20,true);if(Math.abs(player.x-enemy.x)<110&&hurt(enemy,player.mutated?34:20))player.mutation=Math.min(100,player.mutation+14)}else{burst(player.x+player.dir*60,ground()-70,25,true);if(Math.abs(player.x-enemy.x)<180&&hurt(enemy,player.mutated?36:22))player.mutation=Math.min(100,player.mutation+15)}}
function s2(){if(screen!="game"||player.s2>0||player.stun>0)return;player.s2=player.mutated?6.5:5;burst(player.x+player.dir*70,ground()-65,30,true);if(Math.abs(player.x-enemy.x)<240&&hurt(enemy,player.mutated?48:30))player.mutation=Math.min(100,player.mutation+20)}
function mutate(){if(player.mutation>=100&&!player.mutated){player.mutated=true;player.mutation=0;player.mt=8;burst(player.x,ground()-70,45,true)}}
function updateP(dt){player.at=Math.max(0,player.at-dt);player.s1=Math.max(0,player.s1-dt);player.s2=Math.max(0,player.s2-dt);player.flash=Math.max(0,player.flash-dt);player.stun=Math.max(0,player.stun-dt);player.guard=!!I.guard&&player.stun<=0;player.vx=0;if(!player.guard&&player.stun<=0){if(I.left){player.vx=-player.speed;player.dir=-1}if(I.right){player.vx=player.speed;player.dir=1}}player.x=Math.max(45,Math.min(W-45,player.x+player.vx*dt));player.vy-=1550*dt;player.y+=player.vy*dt;if(player.y<0){player.y=0;player.vy=0}if(player.mutated&&(--player.mt<=0)){player.mutated=false;player.mt=0}}
function updateE(dt){enemy.at=Math.max(0,enemy.at-dt);enemy.s1=Math.max(0,enemy.s1-dt);enemy.stun=Math.max(0,enemy.stun-dt);enemy.flash=Math.max(0,enemy.flash-dt);if(mode!="pvp"){let d=player.x-enemy.x;enemy.dir=d>=0?1:-1;if(enemy.stun<=0&&Math.abs(d)>105)enemy.x+=Math.sign(d)*enemy.speed*dt;if(enemy.stun<=0&&Math.abs(d)<=105&&enemy.at<=0){enemy.at=1;hurt(player,enemy.boss?14:8)}if(enemy.boss&&enemy.s1<=0&&Math.abs(d)<260){enemy.s1=3.5;burst(enemy.x+enemy.dir*80,ground()-70,28,true);hurt(player,22)}}enemy.vy-=1550*dt;enemy.y+=enemy.vy*dt;if(enemy.y<0){enemy.y=0;enemy.vy=0}enemy.x=Math.max(45,Math.min(W-45,enemy.x))}
function update(dt){let q=slow>0?dt*.28:dt;slow=Math.max(0,slow-dt);updateP(q);updateE(q);for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.life-=q;p.x+=p.vx*q;p.y+=p.vy*q;p.vx*=.96;p.vy*=.96;if(p.energy)p.vy-=40*q;if(p.life<=0)parts.splice(i,1)}if(player.hp<=0||enemy.hp<=0)screen="result"}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#071326");g.addColorStop(.6,"#162b4c");g.addColorStop(1,"#080b12");x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle="rgba(80,220,255,.12)";x.beginPath();x.arc(W/2,H*.25,180,0,7);x.fill();x.fillStyle="#111927";x.fillRect(0,H-145,W,145);x.strokeStyle="rgba(80,190,255,.22)";for(let a=-H;a<W+H;a+=80){x.beginPath();x.moveTo(a,H-145);x.lineTo(a+H*.25,H);x.stroke()}}
function drawF(f){let gy=ground(),y=gy-f.y;x.save();x.translate(f.x,y);x.scale(f.dir,1);if(f.mutated){x.fillStyle="rgba(255,50,130,.15)";x.beginPath();x.arc(0,-70,78,0,7);x.fill()}x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(0,5,38,9,0,0,7);x.fill();if(f.type=="speed"){x.strokeStyle=f.mutated?"#ff3b70":"#35e5ff";x.lineWidth=7;x.beginPath();x.moveTo(-18,-75);x.lineTo(-65,-75);x.moveTo(-12,-55);x.lineTo(-55,-48);x.stroke()}x.strokeStyle="#111";x.lineWidth=13;x.lineCap="round";x.beginPath();x.moveTo(-12,-22);x.lineTo(-18,5);x.moveTo(12,-22);x.lineTo(20,5);x.stroke();let col=f.type=="speed"?"#12cce5":"#596b7e",gl=f.mutated?"#ff3b70":col;x.shadowBlur=f.mutated?20:8;x.shadowColor=gl;x.fillStyle=col;x.beginPath();x.moveTo(-25,-105);x.lineTo(25,-105);x.lineTo(21,-25);x.lineTo(-21,-25);x.fill();x.shadowBlur=0;x.fillStyle=gl;x.beginPath();x.arc(0,-70,10,0,7);x.fill();x.fillStyle="#efc5a2";x.beginPath();x.arc(0,-128,23,0,7);x.fill();x.fillStyle="#101522";x.beginPath();x.arc(0,-132,24,3.2,6.2);x.fill();x.strokeStyle="#efc5a2";x.lineWidth=12;x.beginPath();x.moveTo(-23,-90);x.lineTo(-43,-52);x.moveTo(23,-90);x.lineTo(43,-55);x.stroke();if(f.type=="core"){x.strokeStyle=gl;x.lineWidth=4;x.beginPath();x.arc(0,-128,25,3.2,6.2);x.stroke()}if(f.guard){x.strokeStyle="#eaffff";x.lineWidth=5;x.beginPath();x.arc(25,-75,55,-1.2,1.2);x.stroke()}if(f.at>0){x.strokeStyle=gl;x.lineWidth=8;x.beginPath();x.arc(45,-80,42,-.8,.6);x.stroke()}if(f.flash>0){x.fillStyle="rgba(255,255,255,.6)";x.beginPath();x.arc(0,-75,55,0,7);x.fill()}x.restore()}
function bar(px,py,w,h,v,m,label,col){x.fillStyle="#07101c";x.fillRect(px,py,w,h);x.fillStyle=col;x.fillRect(px+2,py+2,(w-4)*Math.max(0,v/m),h-4);x.strokeStyle="#fff8";x.strokeRect(px,py,w,h);x.fillStyle="#fff";x.font="bold 12px Arial";x.fillText(label,px,py-5)}
function btn(b,t,on){let cx=b.x+b.w/2,cy=b.y+b.h/2,r=b.w/2;x.fillStyle=on?"rgba(20,210,255,.4)":"rgba(10,18,30,.82)";x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.strokeStyle=on?"#6ef1ff":"#ffffff88";x.lineWidth=2;x.stroke();x.fillStyle="#fff";x.font="bold "+(t.length>3?12:17)+"px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(t,cx,cy);x.textAlign="left";x.textBaseline="alphabetic"}
function game(){bg();let bw=Math.min(250,W*.32);bar(22,24,bw,20,player.hp,player.maxHp,"PLAYER","#ff3f62");bar(W-bw-22,24,bw,20,enemy.hp,enemy.maxHp,enemy.boss?"BOSS":"ENEMY","#ff3f62");bar(22,57,bw,12,player.mutation,100,"BIẾN DỊ","#ffd83d");drawF(player);drawF(enemy);for(let p of parts){x.globalAlpha=Math.max(0,p.life/.6);x.fillStyle=p.energy?"#5de8ff":"#ffd84a";x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}x.globalAlpha=1;btn(U.left,"←",I.left);btn(U.right,"→",I.right);btn(U.jump,"↑");btn(U.guard,"ĐỠ",I.guard);btn(U.attack,"ĐÁNH",player.at>0);btn(U.s1,player.s1?player.s1.toFixed(1):"S1",player.s1>0);btn(U.s2,player.s2?player.s2.toFixed(1):"S2",player.s2>0);if(player.mutation>=100||player.mutated)btn(U.mut,player.mutated?player.mt.toFixed(1):"BIẾN",player.mutated)}
function mbtn(y,t){let w=Math.min(330,W-40),b={x:(W-w)/2,y,w,h:58};x.fillStyle="#121e34";x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle="#38ddff";x.lineWidth=2;x.strokeRect(b.x,b.y,b.w,b.h);x.fillStyle="#fff";x.font="bold 18px Arial";x.textAlign="center";x.fillText(t,W/2,y+36);x.textAlign="left";return b}
function menuDraw(){x.fillStyle="#050914";x.fillRect(0,0,W,H);x.fillStyle="rgba(50,220,255,.12)";x.beginPath();x.arc(W/2,H*.25,180,0,7);x.fill();x.textAlign="center";x.fillStyle="#ffd83d";x.font="900 40px Arial";x.fillText("ĐẤU TRƯỜNG",W/2,H*.15);x.fillStyle="#42e7ff";x.font="900 34px Arial";x.fillText("BIẾN DỊ",W/2,H*.22);x.fillStyle="#c8d6e8";x.font="15px Arial";x.fillText("Chiến đấu • Biến dị • Phá giới hạn",W/2,H*.275);menu=[mbtn(H*.34,"ĐẤU VỚI MÁY"),mbtn(H*.34+72,"ĐẤU VỚI NGƯỜI CHƠI"),mbtn(H*.34+144,"BOSS")];x.fillStyle="#91a5bf";x.font="13px Arial";x.fillText("Nhân vật: "+(sel=="speed"?"KẺ TỐC ĐỘ":"LÕI CÔNG NGHỆ"),W/2,H*.34+220);x.textAlign="left")}
function result(){game();x.fillStyle="#000b";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle=enemy.hp<=0?"#ffe04b":"#ff5270";x.font="900 42px Arial";x.fillText(enemy.hp<=0?"CHIẾN THẮNG":"THẤT BẠI",W/2,H*.35);x.fillStyle="#fff";x.font="18px Arial";x.fillText("Chạm màn hình để về menu",W/2,H*.47);x.textAlign="left"}
c.addEventListener("pointerdown",e=>{let px=e.clientX,py=e.clientY;if(screen=="menu"){for(let i=0;i<menu.length;i++)if(hit(px,py,menu[i])){mode=i==0?"cpu":i==1?"pvp":"boss";reset();screen="game";return}}else if(screen=="result"){screen="menu"}else{if(hit(px,py,U.left))I.left=1;if(hit(px,py,U.right))I.right=1;if(hit(px,py,U.guard))I.guard=1;if(hit(px,py,U.jump))jump();if(hit(px,py,U.attack))attack();if(hit(px,py,U.s1))s1();if(hit(px,py,U.s2))s2();if(hit(px,py,U.mut))mutate()}});
function release(){I.left=I.right=I.guard=0}
c.addEventListener("pointerup",release);c.addEventListener("pointercancel",release);c.addEventListener("pointerleave",e=>{if(e.buttons===0)release()});
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;x.setTransform(D,0,0,D,0,0);if(screen=="menu")menuDraw();else if(screen=="game"){update(dt);game()}else result();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  overflow:hidden;
  background:#05060c;
  color:white;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#38206d 0%,transparent 38%),
    linear-gradient(#10152b,#05060c);
}

/* =========================
   UI
========================= */

.title{
  position:absolute;
  top:7px;
  left:0;
  width:100%;
  text-align:center;
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  z-index:30;
}

.bars{
  position:absolute;
  top:39px;
  left:4%;
  width:92%;
  display:flex;
  gap:14px;
  z-index:30;
}

.status{
  width:50%;
}

.name{
  font-size:12px;
  font-weight:900;
  margin-bottom:3px;
}

.hp,.rage{
  width:100%;
  height:15px;
  background:#242536;
  border:2px solid #55576b;
  border-radius:20px;
  overflow:hidden;
}

.hpFill{
  width:100%;
  height:100%;
  background:#e53935;
  transition:.12s;
}

.rage{
  height:8px;
  margin-top:4px;
}

.rageFill{
  width:0%;
  height:100%;
  background:#a54cff;
  transition:.12s;
}

#message{
  position:absolute;
  top:88px;
  left:0;
  width:100%;
  text-align:center;
  font-weight:900;
  font-size:15px;
  z-index:30;
}

/* =========================
   ARENA
========================= */

.arena{
  position:absolute;
  left:0;
  right:0;
  top:108px;
  bottom:158px;
  overflow:hidden;
}

.arena::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  left:50%;
  top:25%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(180,100,255,.15);
  border-radius:50%;
}

.floor{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:24%;
  background:
    repeating-linear-gradient(
      90deg,
      #252535 0px,
      #252535 40px,
      #29293a 41px,
      #29293a 42px
    );
  border-top:4px solid #59576b;
}

/* =========================
   CHARACTER
========================= */

.fighter{
  position:absolute;
  width:80px;
  height:145px;
  bottom:23%;
  z-index:10;
  transition:left .06s;
}

#player{
  left:17%;
}

#enemy{
  left:72%;
  transform:scaleX(-1);
}

/* đầu */

.head{
  position:absolute;
  left:18px;
  top:0;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#f2bd91;
  border:3px solid #111;
  z-index:4;
}

/* tóc Kẻ Tốc Độ */

#player .head::before{
  content:"";
  position:absolute;
  left:2px;
  top:-13px;
  width:40px;
  height:22px;
  background:#10131d;
  clip-path:polygon(
    0 100%,
    8% 25%,
    28% 65%,
    45% 0,
    55% 55%,
    75% 10%,
    88% 60%,
    100% 35%,
    92% 100%
  );
}

/* mắt */

#player .head::after{
  content:"";
  position:absolute;
  width:8px;
  height:4px;
  background:#10131d;
  left:9px;
  top:21px;
  box-shadow:19px 0 #10131d;
}

/* thân */

.body{
  position:absolute;
  left:11px;
  top:42px;
  width:58px;
  height:62px;
  border-radius:17px 17px 10px 10px;
  background:#171c2a;
  border:3px solid #0a0b10;
}

/* vệt sáng trên áo */

#player .body::after{
  content:"⚡";
  position:absolute;
  left:17px;
  top:12px;
  font-size:25px;
}

/* tay */

.arm{
  position:absolute;
  top:46px;
  width:18px;
  height:57px;
  border-radius:14px;
  background:#f2bd91;
  border:3px solid #101010;
  transform-origin:top center;
  z-index:2;
}

.arm.left{
  left:-2px;
  transform:rotate(25deg);
}

.arm.right{
  right:-2px;
  transform:rotate(-25deg);
}

/* chân */

.leg{
  position:absolute;
  top:98px;
  width:20px;
  height:52px;
  border-radius:12px;
  background:#11151f;
  border:3px solid #08090d;
}

.leg.left{
  left:16px;
}

.leg.right{
  right:16px;
}

/* BOSS */

#enemy .head{
  background:#d6a67e;
}

#enemy .head::before{
  content:"";
  position:absolute;
  width:45px;
  height:18px;
  left:-3px;
  top:-9px;
  background:#491a27;
  border-radius:50% 50% 20% 20%;
}

#enemy .body{
  background:#a5263e;
}

#enemy .body::after{
  content:"☠";
  position:absolute;
  left:16px;
  top:13px;
  font-size:24px;
}

/* =========================
   MUTATION
========================= */

.mutated .head{
  background:#a9ff62;
  box-shadow:
    0 0 15px #72ff32,
    0 0 35px #72ff32;
}

.mutated .body{
  background:#7625d8;
  box-shadow:
    0 0 20px #9b42ff,
    0 0 45px #9b42ff;
  transform:scale(1.15);
}

.mutated .arm,
.mutated .leg{
  box-shadow:0 0 18px #a14cff;
}

.mutated::after{
  content:"BIẾN DỊ";
  position:absolute;
  left:-20px;
  top:-35px;
  width:120px;
  text-align:center;
  color:#d990ff;
  font-size:15px;
  font-weight:900;
  text-shadow:0 0 12px #a342ff;
}

/* =========================
   ANIMATIONS
========================= */

.attackAnim .arm.right{
  animation:punch .25s ease;
}

@keyframes punch{
  0%{transform:rotate(-25deg)}
  50%{transform:rotate(-105deg) translateX(20px)}
  100%{transform:rotate(-25deg)}
}

.kickAnim .leg.right{
  animation:fastKick .28s ease;
}

@keyframes fastKick{
  0%{transform:rotate(0)}
  50%{transform:rotate(-70deg) translateX(18px)}
  100%{transform:rotate(0)}
}

.dashAnim{
  animation:dash .22s ease;
}

@keyframes dash{
  0%{filter:none}
  50%{filter:blur(2px)}
  100%{filter:none}
}

.hit{
  animation:hit .18s ease;
}

@keyframes hit{
  0%{transform:translateX(0)}
  35%{transform:translateX(12px) rotate(3deg)}
  100%{transform:translateX(0)}
}

#enemy.hit{
  transform:scaleX(-1);
  animation:bossHit .18s ease;
}

@keyframes bossHit{
  0%{margin-left:0}
  35%{margin-left:18px}
  100%{margin-left:0}
}

.flash{
  position:absolute;
  left:50%;
  top:50%;
  width:80px;
  height:80px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:white;
  opacity:.9;
  pointer-events:none;
  z-index:50;
  animation:flash .15s ease-out forwards;
}

@keyframes flash{
  from{transform:translate(-50%,-50%) scale(.2);opacity:.9}
  to{transform:translate(-50%,-50%) scale(1.8);opacity:0}
}

.speedLine{
  position:absolute;
  height:3px;
  width:80px;
  background:#b86cff;
  opacity:.8;
  animation:speedLine .3s linear forwards;
  z-index:5;
}

@keyframes speedLine{
  from{transform:translateX(0);opacity:.8}
  to{transform:translateX(-120px);opacity:0}
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  left:0;
  bottom:8px;
  width:100%;
  height:140px;
  z-index:60;
}

.move{
  position:absolute;
  left:8px;
  bottom:5px;
  display:flex;
  gap:6px;
}

.actions{
  position:absolute;
  right:8px;
  bottom:5px;
  display:flex;
  gap:6px;
}

button{
  border:0;
  color:white;
  font-weight:900;
  border-radius:16px;
  min-width:54px;
  height:56px;
  background:#292b3d;
  box-shadow:0 5px 0 #11121b;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #11121b;
}

.moveBtn{
  font-size:22px;
  background:#30354f;
}

.jump{
  background:#276da8;
}

.punch{
  background:#b82e40;
}

.skill{
  background:#7133bd;
}

.strong{
  background:#9c3d20;
}

.mutate{
  background:#7c35ce;
}

.mutate.ready{
  animation:pulse .65s infinite alternate;
}

@keyframes pulse{
  from{
    box-shadow:0 0 5px #9b4cff;
  }
  to{
    box-shadow:0 0 25px #d06cff;
  }
}

/* =========================
   OVERLAY
========================= */

#overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:100;
}

#result{
  font-size:36px;
  font-weight:900;
  margin-bottom:20px;
}

.restart{
  width:180px;
  background:#7939ce;
}

@media(max-width:500px){

  .title{
    font-size:17px;
  }

  .arena{
    top:105px;
    bottom:160px;
  }

  .fighter{
    transform:scale(.85);
  }

  #enemy{
    transform:scaleX(-1) scale(.85);
  }

  button{
    min-width:48px;
    height:53px;
    font-size:11px;
  }

  .moveBtn{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div id="game">

<div class="title">
⚡ ĐẤU TRƯỜNG BIẾN DỊ
</div>

<div class="bars">

<div class="status">

<div class="name">
⚡ KẺ TỐC ĐỘ
</div>

<div class="hp">
<div id="playerHP" class="hpFill"></div>
</div>

<div class="rage">
<div id="playerRage" class="rageFill"></div>
</div>

</div>

<div class="status">

<div class="name" style="text-align:right">
☠ BOSS
</div>

<div class="hp">
<div id="enemyHP" class="hpFill"></div>
</div>

<div class="rage">
<div id="enemyRage" class="rageFill"></div>
</div>

</div>

</div>

<div id="message">
⚡ Kẻ Tốc Độ đã vào đấu trường!
</div>

<div class="arena">

<div id="player" class="fighter">

<div class="head"></div>
<div class="body"></div>

<div class="arm left"></div>
<div class="arm right"></div>

<div class="leg left"></div>
<div class="leg right"></div>

</div>

<div id="enemy" class="fighter">

<div class="head"></div>
<div class="body"></div>

<div class="arm left"></div>
<div class="arm right"></div>

<div class="leg left"></div>
<div class="leg right"></div>

</div>

<div class="floor"></div>

</div>


<!-- CONTROLS -->

<div class="controls">

<div class="move">

<button
class="moveBtn"
ontouchstart="startMove(-1)"
ontouchend="stopMove()"
onmousedown="startMove(-1)"
onmouseup="stopMove()">
◀
</button>

<button
class="moveBtn"
ontouchstart="startMove(1)"
ontouchend="stopMove()"
onmousedown="startMove(1)"
onmouseup="stopMove()">
▶
</button>

<button
class="jump"
onclick="jump()">
⬆️
</button>

</div>

<div class="actions">

<button
class="punch"
onclick="normalAttack()">
👊
</button>

<button
class="skill"
onclick="dashSkill()">
💨
</button>

<button
class="skill"
onclick="afterImage()">
⚡
</button>

<button
class="strong"
onclick="breakSpeed()">
💥
</button>

<button
id="mutateBtn"
class="mutate"
onclick="mutate()">
🧬
</button>

</div>

</div>


<div id="overlay">

<div id="result"></div>

<button
class="restart"
onclick="restartGame()">
🔄 CHƠI LẠI
</button>

</div>

</div>


<script>

/* =========================
GAME DATA
========================= */

let playerHP=100;
let enemyHP=100;

let playerRage=0;
let enemyRage=0;

let playerX=17;
let enemyX=72;

let moveDirection=0;

let guarding=false;
let jumping=false;

let playerMutated=false;
let enemyMutated=false;

let gameOver=false;

let attacking=false;

let mutationTimer;


/* =========================
UPDATE
========================= */

function update(){

playerHP=Math.max(0,playerHP);
enemyHP=Math.max(0,enemyHP);

playerRage=Math.min(100,playerRage);
enemyRage=Math.min(100,enemyRage);

document.getElementById("playerHP").style.width=
playerHP+"%";

document.getElementById("enemyHP").style.width=
enemyHP+"%";

document.getElementById("playerRage").style.width=
playerRage+"%";

document.getElementById("enemyRage").style.width=
enemyRage+"%";

document.getElementById("player").style.left=
playerX+"%";

document.getElementById("enemy").style.left=
enemyX+"%";

if(playerRage>=100)
document.getElementById("mutateBtn")
.classList.add("ready");
else
document.getElementById("mutateBtn")
.classList.remove("ready");

}


/* =========================
MESSAGE
========================= */

function say(text){

document.getElementById("message")
.textContent=text;

}


/* =========================
MOVE
========================= */

function startMove(dir){

if(gameOver)return;

moveDirection=dir;

}

function stopMove(){

moveDirection=0;

}

setInterval(()=>{

if(gameOver)return;

if(moveDirection!==0){

playerX+=moveDirection*1.35;

playerX=Math.max(3,Math.min(84,playerX));

update();

}

},30);


/* =========================
JUMP
========================= */

function jump(){

if(gameOver||jumping)return;

jumping=true;

let p=document.getElementById("player");

p.style.bottom="50%";

setTimeout(()=>{

p.style.bottom="23%";

jumping=false;

},430);

}


/* =========================
DISTANCE
========================= */

function distance(){

return Math.abs(playerX-enemyX);

}


/* =========================
HIT EFFECT
========================= */

function hitEffect(){

let flash=document.createElement("div");

flash.className="flash";

document.querySelector(".arena")
.appendChild(flash);

setTimeout(()=>flash.remove(),180);

}


/* =========================
HIT STOP
========================= */

function hitStop(){

let game=document.getElementById("game");

game.style.filter="brightness(1.5)";

setTimeout(()=>{

game.style.filter="";

},110);

}


/* =========================
ENEMY HIT
========================= */

function damageEnemy(damage,knockback){

enemyHP-=damage;

playerRage=
Math.min(100,playerRage+damage*1.3);

enemyX+=knockback;

enemyX=Math.min(88,Math.max(5,enemyX));

let enemy=
document.getElementById("enemy");

enemy.classList.remove("hit");

void enemy.offsetWidth;

enemy.classList.add("hit");

hitEffect();

hitStop();

update();

checkWin();

}


/* =========================
NORMAL ATTACK
========================= */

function normalAttack(){

if(gameOver||attacking)return;

if(distance()>18){

say("💨 Quá xa!");

return;

}

attacking=true;

let p=document.getElementById("player");

p.classList.add("attackAnim");

setTimeout(()=>{

if(!gameOver)
damageEnemy(playerMutated?18:10,2);

},100);

setTimeout(()=>{

p.classList.remove("attackAnim");
attacking=false;

},270);

}


/* =========================
DASH SKILL
========================= */

function dashSkill(){

if(gameOver||attacking)return;

if(distance()>35){

say("💨 Không đủ khoảng cách!");

return;

}

attacking=true;

let p=document.getElementById("player");

let oldX=playerX;

playerX=enemyX-9;

playerX=Math.max(3,Math.min(84,playerX));

p.classList.add("dashAnim");

createSpeedLines();

say("💨 LƯỚT XUYÊN!");

update();

setTimeout(()=>{

if(!gameOver){

damageEnemy(
playerMutated?25:15,
playerMutated?5:4
);

}

},100);

setTimeout(()=>{

p.classList.remove("dashAnim");
attacking=false;

},330);

}


/* =========================
SPEED LINES
========================= */

function createSpeedLines(){

for(let i=0;i<5;i++){

let line=document.createElement("div");

line.className="speedLine";

line.style.left=
(playerX*1.05+Math.random()*5)+"%";

line.style.top=
(35+Math.random()*40)+"%";

document.querySelector(".arena")
.appendChild(line);

setTimeout(()=>line.remove(),350);

}

}


/* =========================
AFTER IMAGE
========================= */

function afterImage(){

if(gameOver||attacking)return;

if(distance()>24){

say("⚡ Hãy áp sát!");

return;

}

attacking=true;

say("⚡ ẢNH TỐC!");

let p=document.getElementById("player");

let clone=p.cloneNode(true);

clone.id="";

clone.style.opacity=".3";
clone.style.filter="blur(4px)";
clone.style.left=playerX+"%";

document.querySelector(".arena")
.appendChild(clone);

setTimeout(()=>clone.remove(),350);

setTimeout(()=>{

damageEnemy(
playerMutated?28:17,
3
);

},120);

setTimeout(()=>{

attacking=false;

},350);

}


/* =========================
BREAK SPEED
========================= */

function breakSpeed(){

if(gameOver||attacking)return;

if(distance()>20){

say("💥 Quá xa!");

return;

}

attacking=true;

say("💥 PHÁ TỐC!");

let p=document.getElementById("player");

p.classList.add("attackAnim");

setTimeout(()=>{

damageEnemy(
playerMutated?40:25,
8
);

},140);

setTimeout(()=>{

p.classList.remove("attackAnim");

attacking=false;

},400);

}


/* =========================
MUTATION
========================= */

function mutate(){

if(gameOver)return;

if(playerRage<100){

say("🧬 NỘI chưa đầy!");

return;

}

if(playerMutated){

say("🔥 Đang biến dị!");

return;

}

playerRage=0;

playerMutated=true;

document.getElementById("player")
.classList.add("mutated");

say("🧬 KẺ TỐC ĐỘ — BIẾN DỊ!");

update();

clearTimeout(mutationTimer);

mutationTimer=setTimeout(()=>{

playerMutated=false;

document.getElementById("player")
.classList.remove("mutated");

say("↩️ Biến dị kết thúc!");

update();

},8000);

}


/* =========================
BOSS AI
========================= */

function bossAI(){

if(gameOver)return;

let d=distance();

if(d>17){

if(enemyX>playerX)
enemyX-=.75;
else
enemyX+=.75;

enemyX=Math.max(5,Math.min(87,enemyX));

update();

return;

}

if(Math.random()<.62){

let damage=
enemyMutated?18:9;

if(guarding){

damage=Math.floor(damage*.25);

say("🛡️ Đỡ được đòn Boss!");

}else{

say("💥 Boss đánh!");

}

playerHP-=damage;

enemyRage=
Math.min(100,enemyRage+15);

update();

checkWin();

}

}

setInterval(bossAI,650);


/* =========================
BOSS MUTATION
========================= */

function enemyMutation(){

if(enemyRage<100||enemyMutated)return;

enemyRage=0;

enemyMutated=true;

document.getElementById("enemy")
.classList.add("mutated");

say("☠️ BOSS ĐÃ BIẾN DỊ!");

update();

setTimeout(()=>{

enemyMutated=false;

document.getElementById("enemy")
.classList.remove("mutated");

say("Boss trở lại bình thường!");

update();

},8000);

}

setInterval(enemyMutation,500);


/* =========================
GUARD
========================= */

function activateGuard(){

guarding=true;

say("🛡️ Đang phòng thủ!");

setTimeout(()=>{

guarding=false;

},850);

}


/* =========================
TOUCH GUARD
========================= */

document.addEventListener("keydown",e=>{

if(e.key===" "){
activateGuard();
}

});


/* =========================
WIN
========================= */

function checkWin(){

if(playerHP<=0){

playerHP=0;

endGame("💀 THẤT BẠI");

return;

}

if(enemyHP<=0){

enemyHP=0;

endGame("🏆 KẺ TỐC ĐỘ CHIẾN THẮNG!");

}

update();

}


/* =========================
END
========================= */

function endGame(text){

gameOver=true;

moveDirection=0;

document.getElementById("result")
.textContent=text;

document.getElementById("overlay")
.style.display="flex";

}


/* =========================
RESTART
========================= */

function restartGame(){

playerHP=100;
enemyHP=100;

playerRage=0;
enemyRage=0;

playerX=17;
enemyX=72;

moveDirection=0;

guarding=false;
jumping=false;

playerMutated=false;
enemyMutated=false;

gameOver=false;
attacking=false;

clearTimeout(mutationTimer);

document.getElementById("player")
.classList.remove("mutated");

document.getElementById("enemy")
.classList.remove("mutated");

document.getElementById("overlay")
.style.display="none";

say("⚡ Kẻ Tốc Độ đã trở lại!");

update();

}


/* =========================
START
========================= */

update();

</script>

</body>
      </html>

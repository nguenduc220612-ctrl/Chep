<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#07101b;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#08111e;
}

button{
    border:none;
    color:white;
    background:#10283d;
    border:1px solid #34749d;
    border-radius:15px;
    font-weight:bold;
    touch-action:none;
}

.hidden{
    display:none!important;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
      radial-gradient(circle at 50% 20%,
      #16466d,#07101b 65%);
}

.menuBox{
    width:min(430px,95vw);
    padding:25px;
    border-radius:22px;
    background:rgba(4,12,22,.94);
    border:1px solid #34749d;
    text-align:center;
}

.title{
    font-size:32px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    color:#9edbff;
    margin-bottom:20px;
}

.characters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.character{
    min-height:135px;
    padding:10px;
    background:#0d1d2d;
}

.character.selected{
    border:2px solid #58d6ff;
    background:#12334b;
}

.icon{
    font-size:45px;
    display:block;
    margin-bottom:8px;
}

.menuButton{
    width:100%;
    height:52px;
    margin-top:10px;
    font-size:16px;
}

/* HUD */

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
}

.hudBox{
    width:43%;
}

.hudName{
    font-size:14px;
    font-weight:bold;
    margin-bottom:4px;
}

.bar{
    height:13px;
    background:#182737;
    border:1px solid #496b82;
    border-radius:20px;
    overflow:hidden;
}

.hp{
    width:100%;
    height:100%;
    background:#43dc83;
}

.mutation{
    height:7px;
    margin-top:4px;
    background:#182737;
    border-radius:20px;
    overflow:hidden;
}

.mutationBar{
    width:0%;
    height:100%;
    background:#53d8ff;
}

/* CONTROLS */

#controls{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:end;
}

.controlGroup{
    display:flex;
    gap:7px;
}

.control{
    width:55px;
    height:55px;
    font-size:13px;
}

.attack{
    width:65px;
    height:65px;
}

.skill{
    background:#12364b;
}

.mutateButton{
    background:#292c55;
    border-color:#8175e8;
}

.cooldown{
    display:block;
    font-size:9px;
    color:#83ddff;
    margin-top:2px;
}

#back{
    position:fixed;
    top:10px;
    left:10px;
    width:55px;
    height:45px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->

<div id="menu">

<div class="menuBox">

<div class="title">
ĐẤU TRƯỜNG BIẾN DỊ
</div>

<div class="subtitle">
Chọn nhân vật
</div>

<div class="characters">

<button class="character selected"
        data-character="speed">

<span class="icon">⚡</span>

<b>Kẻ Tốc Độ</b>

<br>

<small>Nhanh • Cận chiến</small>

</button>


<button class="character"
        data-character="core">

<span class="icon">⚙️</span>

<b>Lõi Công Nghệ</b>

<br>

<small>Công nghệ • Drone</small>

</button>

</div>


<button class="menuButton"
        data-mode="cpu">
ĐẤU VỚI MÁY
</button>


<button class="menuButton"
        data-mode="pvp">
ĐẤU VỚI NGƯỜI CHƠI
</button>


<button class="menuButton"
        data-mode="boss">
BOSS
</button>

</div>
</div>


<!-- HUD -->

<div id="hud" class="hidden">

<div class="hudBox">

<div id="playerName"
     class="hudName">
</div>

<div class="bar">
<div id="playerHP"
     class="hp">
</div>
</div>

<div class="mutation">
<div id="playerMutation"
     class="mutationBar">
</div>
</div>

</div>


<div class="hudBox">

<div id="enemyName"
     class="hudName"
     style="text-align:right">
</div>

<div class="bar">
<div id="enemyHP"
     class="hp">
</div>
</div>

<div class="mutation">
<div id="enemyMutation"
     class="mutationBar">
</div>
</div>

</div>

</div>


<button id="back"
        class="hidden">
←
</button>


<!-- CONTROLS -->

<div id="controls"
     class="hidden">

<div class="controlGroup">

<button id="left"
        class="control">
◀
<br>
<small>Lùi</small>
</button>

<button id="right"
        class="control">
▶
<br>
<small>Tiến</small>
</button>

<button id="jump"
        class="control">
▲
<br>
<small>Nhảy</small>
</button>

</div>


<div class="controlGroup">

<button id="guard"
        class="control">
🛡
<br>
<small>Đỡ</small>
</button>

<button id="attack"
        class="control attack">
ĐÁNH
</button>

<button id="skill1"
        class="control skill">
S1
<span class="cooldown"></span>
</button>

<button id="skill2"
        class="control skill">
S2
<span class="cooldown"></span>
</button>

<button id="mutate"
        class="control mutateButton">
BIẾN
</button>

</div>

</div>


<script>

/* =========================
   GAME SETUP
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;
}

addEventListener("resize",resize);

resize();


/* =========================
   CHARACTERS
========================= */

const characters = {

speed:{

    name:"Kẻ Tốc Độ",

    normalSkill1:"Lướt Xung Kích",

    normalSkill2:"Ảnh Tốc",

    mutationSkill1:"Bão Tốc",

    mutationSkill2:"Phân Thân",

    color:"#62e8ff",

    accent:"#188aff"
},


core:{

    name:"Lõi Công Nghệ",

    normalSkill1:"Drone Xung Điện",

    normalSkill2:"Găng Năng Lượng",

    mutationSkill1:"Bầy Drone",

    mutationSkill2:"Lõi Quá Tải",

    color:"#52c9ff",

    accent:"#235cff"
}

};


/* =========================
   GAME STATE
========================= */

let selectedCharacter =
"speed";

let gameMode =
"cpu";

let gameRunning =
false;

let gameOver =
false;

let lastTime =
performance.now();


/* =========================
   INPUT
========================= */

const input = {

    left:false,
    right:false,
    guard:false

};


/* =========================
   FIGHTER
========================= */

function createFighter(
    character,
    x,
    enemy=false
){

    return {

        character:character,

        x:x,

        y:0,

        vx:0,

        vy:0,

        hp:100,

        maxHP:100,

        mutation:0,

        mutated:false,

        mutationTime:0,

        attackTimer:0,

        skill1Cooldown:0,

        skill2Cooldown:0,

        guard:false,

        enemy:enemy,

        aiTimer:0
    };
}


let player;
let enemy;


/* =========================
   START GAME
========================= */

function startGame(mode){

    gameMode = mode;

    player =
    createFighter(
        selectedCharacter,
        W * .28,
        false
    );


    let enemyCharacter =
    selectedCharacter === "speed"
    ? "core"
    : "speed";


    enemy =
    createFighter(
        mode === "boss"
        ? "core"
        : enemyCharacter,
        W * .72,
        true
    );


    if(mode === "boss"){

        enemy.maxHP = 200;
        enemy.hp = 200;
    }


    gameRunning = true;
    gameOver = false;


    document
    .getElementById("menu")
    .classList.add("hidden");


    document
    .getElementById("hud")
    .classList.remove("hidden");


    document
    .getElementById("controls")
    .classList.remove("hidden");


    document
    .getElementById("back")
    .classList.remove("hidden");


    updateUI();
}


/* =========================
   MENU
========================= */

document
.querySelectorAll(".character")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            selectedCharacter =
            button.dataset.character;


            document
            .querySelectorAll(".character")
            .forEach(b=>
                b.classList.remove("selected")
            );


            button.classList.add(
                "selected"
            );
        }
    );
});


document
.querySelectorAll("[data-mode]")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            startGame(
                button.dataset.mode
            );
        }
    );
});


document
.getElementById("back")
.addEventListener(
    "click",
    showMenu
);


function showMenu(){

    gameRunning = false;

    document
    .getElementById("menu")
    .classList.remove("hidden");

    document
    .getElementById("hud")
    .classList.add("hidden");

    document
    .getElementById("controls")
    .classList.add("hidden");

    document
    .getElementById("back")
    .classList.add("hidden");
}


/* =========================
   HOLD BUTTON
   THẢ RA = DỪNG NGAY
========================= */

function holdButton(
    id,
    property
){

    const button =
    document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            input[property] = true;

            button.setPointerCapture(
                event.pointerId
            );
        }
    );


    button.addEventListener(
        "pointerup",
        event=>{

            event.preventDefault();

            input[property] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        ()=>{

            input[property] = false;
        }
    );
}


holdButton("left","left");

holdButton("right","right");

holdButton("guard","guard");


/* =========================
   JUMP
========================= */

document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        if(
            player &&
            player.y === 0
        ){

            player.vy = -470;
        }
    }
);


/* =========================
   ATTACK
========================= */

document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        normalAttack(
            player,
            enemy
        );
    }
);


/* =========================
   SKILLS
========================= */

document
.getElementById("skill1")
.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        useSkill(
            player,
            enemy,
            1
        );
    }
);


document
.getElementById("skill2")
.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        useSkill(
            player,
            enemy,
            2
        );
    }
);


/* =========================
   MUTATION
========================= */

document
.getElementById("mutate")
.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        if(
            player &&
            player.mutation >= 100 &&
            !player.mutated
        ){

            player.mutated = true;

            player.mutationTime = 8;
        }
    }
);


/* =========================
   DAMAGE
========================= */

function damage(
    target,
    amount
){

    if(target.guard){

        amount *= .25;
    }


    target.hp =
    Math.max(
        0,
        target.hp - amount
    );


    if(target === enemy){

        player.mutation =
        Math.min(
            100,
            player.mutation +
            amount
        );
    }


    if(target === player){

        enemy.mutation =
        Math.min(
            100,
            enemy.mutation +
            amount * .5
        );
    }
}


/* =========================
   NORMAL ATTACK
========================= */

function normalAttack(
    attacker,
    target
){

    if(
        !attacker ||
        !target ||
        attacker.attackTimer > 0
    ){

        return;
    }


    attacker.attackTimer =
    .25;


    const distance =
    Math.abs(
        attacker.x -
        target.x
    );


    if(distance < 95){

        let power =
        attacker.mutated
        ? 22
        : 14;


        damage(
            target,
            power
        );
    }
}


/* =========================
   SKILL SYSTEM
========================= */

function useSkill(
    attacker,
    target,
    number
){

    if(!attacker)return;


    const cooldown =
    number === 1
    ? "skill1Cooldown"
    : "skill2Cooldown";


    if(
        attacker[cooldown] > 0
    ){

        return;
    }


    attacker[cooldown] =
    number === 1
    ? 4
    : 7;


    let power;


    if(!attacker.mutated){

        power =
        number === 1
        ? 20
        : 27;

    }else{

        /* SKILL BIẾN DỊ */

        power =
        number === 1
        ? 34
        : 42;
    }


    const distance =
    Math.abs(
        attacker.x -
        target.x
    );


    if(distance < 200){

        damage(
            target,
            power
        );
    }


    /* Lướt */

    if(number === 1){

        attacker.vx =
        attacker.x <
        target.x
        ? 420
        : -420;
    }


    /* Găng năng lượng */

    if(number === 2){

        target.vx =
        target.x <
        attacker.x
        ? -300
        : 300;
    }
}


/* =========================
   PLAYER INPUT
========================= */

function updatePlayer(){

    if(!player)return;


    player.guard =
    input.guard;


    let direction = 0;


    if(input.left)
        direction -= 1;


    if(input.right)
        direction += 1;


    if(!player.guard){

        /*
         QUAN TRỌNG:
         không nhấn = vận tốc ngang = 0
        */

        player.vx =
        direction * 260;

    }else{

        player.vx = 0;
    }
}


/* =========================
   BOSS / AI
========================= */

function updateAI(dt){

    if(!enemy)return;


    if(gameMode === "pvp"){

        return;
    }


    enemy.aiTimer -= dt;


    const distance =
    player.x -
    enemy.x;


    const direction =
    Math.sign(distance);


    if(
        Math.abs(distance) > 105
    ){

        enemy.vx =
        direction *
        (gameMode === "boss"
        ? 150
        : 180);

    }else{

        enemy.vx = 0;
    }


    if(enemy.aiTimer <= 0){

        enemy.aiTimer =
        .6 +
        Math.random() * .8;


        if(
            Math.abs(distance) < 105
        ){

            normalAttack(
                enemy,
                player
            );

        }else{

            useSkill(
                enemy,
                player,
                Math.random() < .5
                ? 1
                : 2
            );
        }
    }
}


/* =========================
   PHYSICS
========================= */

function updatePhysics(
    fighter,
    dt
){

    if(!fighter)return;


    fighter.attackTimer =
    Math.max(
        0,
        fighter.attackTimer - dt
    );


    fighter.skill1Cooldown =
    Math.max(
        0,
        fighter.skill1Cooldown - dt
    );


    fighter.skill2Cooldown =
    Math.max(
        0,
        fighter.skill2Cooldown - dt
    );


    /* BIẾN DỊ */

    if(fighter.mutated){

        fighter.mutationTime -= dt;


        if(
            fighter.mutationTime <= 0
        ){

            fighter.mutated = false;

            fighter.mutation = 0;
        }
    }


    /* Trọng lực */

    fighter.vy +=
    1100 * dt;


    fighter.y +=
    fighter.vy * dt;


    if(fighter.y > 0){

        fighter.y = 0;

        fighter.vy = 0;
    }


    /* Di chuyển */

    fighter.x +=
    fighter.vx * dt;


    /* Giới hạn */

    fighter.x =
    Math.max(
        35,
        Math.min(
            W - 35,
            fighter.x
        )
    );


    /*
      Chỉ giảm vận tốc khi
      không có input điều khiển.
      AI cũng tự đặt vận tốc.
    */

    fighter.vx *=
    Math.pow(
        .0001,
        dt
    );
}


/* =========================
   GAME UPDATE
========================= */

function updateGame(dt){

    if(
        !gameRunning ||
        gameOver
    ){

        return;
    }


    updatePlayer();

    updateAI(dt);


    updatePhysics(
        player,
        dt
    );


    updatePhysics(
        enemy,
        dt
    );


    if(
        player.hp <= 0 ||
        enemy.hp <= 0
    ){

        gameOver = true;

        gameRunning = false;

        setTimeout(()=>{

            alert(
                enemy.hp <= 0
                ? "BẠN THẮNG!"
                : "BẠN THUA!"
            );

            showMenu();

        },100);
    }


    updateUI();
}


/* =========================
   DRAW FIGHTER
========================= */

function drawFighter(
    fighter
){

    const data =
    characters[
        fighter.character
    ];


    const x =
    fighter.x;


    const y =
    H - 130 -
    fighter.y;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    if(fighter.enemy){

        ctx.scale(
            -1,
            1
        );
    }


    /* Aura biến dị */

    if(fighter.mutated){

        ctx.strokeStyle =
        data.color;

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            0,
            -55,
            58,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }


    /* Thân */

    ctx.fillStyle =
    "#111c2a";

    ctx.fillRect(
        -21,
        -72,
        42,
        60
    );


    /* Đầu */

    ctx.fillStyle =
    "#eaf4ff";

    ctx.beginPath();

    ctx.arc(
        0,
        -91,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Tóc */

    ctx.fillStyle =
    "#cbd9e8";

    ctx.beginPath();

    ctx.moveTo(
        -20,
        -95
    );

    ctx.lineTo(
        0,
        -115
    );

    ctx.lineTo(
        22,
        -96
    );

    ctx.fill();


    /* Lõi */

    ctx.fillStyle =
    data.color;

    ctx.beginPath();

    ctx.arc(
        0,
        -50,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Công nghệ */

    if(
        fighter.character === "core"
    ){

        ctx.strokeStyle =
        data.color;

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            35,
            -62,
            13,
            0,
            Math.PI * 2
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            22,
            -62
        );

        ctx.lineTo(
            35,
            -62
        );

        ctx.stroke();


        if(fighter.mutated){

            ctx.strokeStyle =
            "#b9f5ff";

            ctx.lineWidth = 6;

            ctx.beginPath();

            ctx.arc(
                -35,
                -55,
                15,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }

    }else{

        /* Tia tốc độ */

        ctx.strokeStyle =
        data.color;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            -25,
            -50
        );

        ctx.lineTo(
            -45,
            -75
        );

        ctx.stroke();
    }


    /* Đỡ */

    if(fighter.guard){

        ctx.strokeStyle =
        "#ffffff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            35,
            -55,
            28,
            -1.2,
            1.2
        );

        ctx.stroke();
    }


    /* Đánh */

    if(
        fighter.attackTimer > 0
    ){

        ctx.strokeStyle =
        data.color;

        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.moveTo(
            20,
            -50
        );

        ctx.lineTo(
            75,
            -50
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* =========================
   RENDER
========================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* Background */

    const gradient =
    ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );


    gradient.addColorStop(
        0,
        "#071421"
    );


    gradient.addColorStop(
        1,
        "#152b40"
    );


    ctx.fillStyle =
    gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Thành phố */

    ctx.fillStyle =
    "rgba(70,140,190,.12)";


    for(
        let i=0;
        i<10;
        i++
    ){

        const x =
        i*150 -
        (performance.now()/40)%150;


        ctx.fillRect(
            x,
            H-310,
            90,
            190
        );
    }


    /* Sàn */

    ctx.strokeStyle =
    "#38586c";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        H-122
    );

    ctx.lineTo(
        W,
        H-122
    );

    ctx.stroke();


    if(player)
        drawFighter(player);


    if(enemy)
        drawFighter(enemy);
}


/* =========================
   UI
========================= */

function updateUI(){

    if(!player || !enemy)
        return;


    document
    .getElementById("playerName")
    .textContent =
    characters[player.character].name +
    (player.mutated
    ? " • BIẾN DỊ"
    : "");


    document
    .getElementById("enemyName")
    .textContent =
    gameMode === "boss"
    ? "BOSS"
    : characters[
        enemy.character
      ].name;


    document
    .getElementById("playerHP")
    .style.width =
    (
      player.hp /
      player.maxHP *
      100
    ) + "%";


    document
    .getElementById("enemyHP")
    .style.width =
    (
      enemy.hp /
      enemy.maxHP *
      100
    ) + "%";


    document
    .getElementById("playerMutation")
    .style.width =
    player.mutation + "%";


    document
    .getElementById("enemyMutation")
    .style.width =
    enemy.mutation + "%";


    const data =
    characters[player.character];


    document
    .querySelector("#skill1 .cooldown")
    .textContent =
    player.skill1Cooldown > 0
    ? player.skill1Cooldown.toFixed(1)
    : (
        player.mutated
        ? data.mutationSkill1
        : data.normalSkill1
      );


    document
    .querySelector("#skill2 .cooldown")
    .textContent =
    player.skill2Cooldown > 0
    ? player.skill2Cooldown.toFixed(1)
    : (
        player.mutated
        ? data.mutationSkill2
        : data.normalSkill2
      );
}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(timestamp){

    const deltaTime =
    Math.min(
        (timestamp-lastTime)/1000,
        0.033
    );


    lastTime =
    timestamp;


    /*
      1. Nhận input
      2. AI
      3. Vật lý
      4. Combat
      5. Skill
      6. Mutation
      7. UI
      8. Render
    */

    updateGame(
        deltaTime
    );


    render();


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>

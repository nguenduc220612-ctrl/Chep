<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

body{
    background:#111;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#222;
}

button{
    border:0;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
/* =========================
   ĐẤU TRƯỜNG BIẾN DỊ
   CODE LẠI TỪ ĐẦU
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;
}

addEventListener("resize",resize);
resize();


/* =========================
   TRẠNG THÁI GAME
========================= */

let screen = "menu";
let mode = "cpu";

let selectedCharacter = "speed";

let lastTime = 0;


/* =========================
   NHÂN VẬT
========================= */

function createFighter(type,x,enemy=false){

    return {
        type:type,

        x:x,
        y:0,

        vx:0,
        vy:0,

        width:55,
        height:100,

        speed:300,
        jumpPower:650,

        hp:100,
        maxHp:100,

        mutation:0,
        maxMutation:100,

        mutated:false,
        mutationTime:0,

        attackTimer:0,
        skill1Timer:0,
        skill2Timer:0,

        guard:false,
        attacking:false,

        enemy:enemy,

        direction:enemy ? -1 : 1
    };
}

let player = createFighter("speed",180);
let enemy = createFighter("core",W-180,true);


/* =========================
   INPUT
========================= */

const keys = {
    left:false,
    right:false,
    jump:false,
    guard:false
};


/* =========================
   NÚT MOBILE
========================= */

const controls = {

    left:{
        x:25,
        y:0,
        w:70,
        h:70
    },

    right:{
        x:105,
        y:0,
        w:70,
        h:70
    },

    jump:{
        x:0,
        y:0,
        w:75,
        h:75
    },

    guard:{
        x:0,
        y:0,
        w:75,
        h:75
    },

    attack:{
        x:0,
        y:0,
        w:80,
        h:80
    },

    skill1:{
        x:0,
        y:0,
        w:70,
        h:70
    },

    skill2:{
        x:0,
        y:0,
        w:70,
        h:70
    },

    mutate:{
        x:0,
        y:0,
        w:75,
        h:75
    }
};


function updateButtons(){

    const bottom = H - 95;

    controls.left.x = 25;
    controls.left.y = bottom;

    controls.right.x = 105;
    controls.right.y = bottom;

    controls.jump.x = W - 300;
    controls.jump.y = bottom;

    controls.guard.x = W - 215;
    controls.guard.y = bottom;

    controls.attack.x = W - 110;
    controls.attack.y = bottom;

    controls.skill1.x = W - 205;
    controls.skill1.y = bottom - 85;

    controls.skill2.x = W - 115;
    controls.skill2.y = bottom - 85;

    controls.mutate.x = W - 70;
    controls.mutate.y = 25;
}

updateButtons();

addEventListener("resize",updateButtons);


/* =========================
   KIỂM TRA NÚT
========================= */

function inside(px,py,b){

    return (
        px >= b.x &&
        px <= b.x+b.w &&
        py >= b.y &&
        py <= b.y+b.h
    );
}


/* =========================
   TOUCH
========================= */

canvas.addEventListener("pointerdown",e=>{

    const x = e.clientX;
    const y = e.clientY;

    if(screen === "menu"){
        handleMenu(x,y);
        return;
    }

    if(screen !== "game") return;

    if(inside(x,y,controls.left))
        keys.left=true;

    if(inside(x,y,controls.right))
        keys.right=true;

    if(inside(x,y,controls.jump))
        jump();

    if(inside(x,y,controls.guard))
        keys.guard=true;

    if(inside(x,y,controls.attack))
        attack();

    if(inside(x,y,controls.skill1))
        skill1();

    if(inside(x,y,controls.skill2))
        skill2();

    if(inside(x,y,controls.mutate))
        activateMutation();
});


canvas.addEventListener("pointerup",e=>{

    keys.left=false;
    keys.right=false;
    keys.guard=false;
});


canvas.addEventListener("pointercancel",e=>{

    keys.left=false;
    keys.right=false;
    keys.guard=false;
});


/* =========================
   MENU
========================= */

function handleMenu(x,y){

    const center = W/2;

    if(y > H*0.35 && y < H*0.35+65){

        mode="cpu";
        startGame();
    }

    else if(y > H*0.35+85 && y < H*0.35+150){

        mode="pvp";
        startGame();
    }

    else if(y > H*0.35+170 && y < H*0.35+235){

        mode="boss";
        startGame();
    }
}


function startGame(){

    player = createFighter(
        selectedCharacter,
        180
    );

    enemy = createFighter(
        selectedCharacter === "speed"
            ? "core"
            : "speed",
        W-180,
        true
    );

    if(mode==="boss"){
        enemy.width=90;
        enemy.height=150;
        enemy.hp=250;
        enemy.maxHp=250;
        enemy.speed=180;
    }

    screen="game";
}


/* =========================
   NHẢY
========================= */

function jump(){

    /*
      Y = chiều cao.
      0 = mặt đất.
      Y càng lớn = càng cao.
    */

    if(player.y <= 0.01){

        player.y = 0;
        player.vy = player.jumpPower;
    }
}


/* =========================
   ĐÁNH
========================= */

function attack(){

    if(player.attackTimer > 0)
        return;

    player.attackTimer = 0.35;
    player.attacking = true;

    setTimeout(()=>{
        player.attacking=false;
    },180);

    const distance =
        Math.abs(player.x-enemy.x);

    if(distance < 120){

        let damage =
            player.mutated ? 18 : 10;

        if(!enemy.guard){

            enemy.hp -= damage;

            player.mutation += 10;
        }
    }
}


/* =========================
   SKILL 1
========================= */

function skill1(){

    if(player.skill1Timer > 0)
        return;

    player.skill1Timer = 3;

    let damage;

    if(player.mutated){

        damage = 30;
    }else{

        damage = 18;
    }

    if(Math.abs(player.x-enemy.x)<180 &&
       !enemy.guard){

        enemy.hp -= damage;
        player.mutation += 15;
    }
}


/* =========================
   SKILL 2
========================= */

function skill2(){

    if(player.skill2Timer > 0)
        return;

    player.skill2Timer = 5;

    let damage =
        player.mutated ? 40 : 25;

    if(Math.abs(player.x-enemy.x)<220 &&
       !enemy.guard){

        enemy.hp -= damage;
        player.mutation += 20;
    }
}


/* =========================
   BIẾN DỊ
========================= */

function activateMutation(){

    if(player.mutation < player.maxMutation)
        return;

    if(player.mutated)
        return;

    player.mutated=true;
    player.mutation=0;
    player.mutationTime=8;
}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(dt){

    player.attackTimer =
        Math.max(0,player.attackTimer-dt);

    player.skill1Timer =
        Math.max(0,player.skill1Timer-dt);

    player.skill2Timer =
        Math.max(0,player.skill2Timer-dt);


    /* DI CHUYỂN */

    player.vx=0;

    if(keys.left){

        player.vx=-player.speed;
        player.direction=-1;
    }

    if(keys.right){

        player.vx=player.speed;
        player.direction=1;
    }

    player.x += player.vx*dt;


    /* VẬT LÝ NHẢY */

    player.vy -= 1500*dt;

    player.y += player.vy*dt;


    /* CHẠM ĐẤT */

    if(player.y < 0){

        player.y=0;
        player.vy=0;
    }


    /* ĐỠ */

    player.guard=keys.guard;


    /* BIẾN DỊ */

    if(player.mutated){

        player.mutationTime-=dt;

        if(player.mutationTime<=0){

            player.mutated=false;
            player.mutationTime=0;
        }
    }


    /* GIỚI HẠN SÂN */

    player.x =
        Math.max(40,
        Math.min(W-40,player.x));
}


/* =========================
   AI
========================= */

function updateEnemy(dt){

    enemy.attackTimer =
        Math.max(0,enemy.attackTimer-dt);

    enemy.skill1Timer =
        Math.max(0,enemy.skill1Timer-dt);

    enemy.skill2Timer =
        Math.max(0,enemy.skill2Timer-dt);


    if(mode==="pvp")
        return;


    const distance =
        player.x-enemy.x;


    /* ĐUỔI THEO PLAYER */

    if(Math.abs(distance)>100){

        enemy.vx =
            Math.sign(distance)*enemy.speed;

        enemy.x += enemy.vx*dt;
    }


    /* TẤN CÔNG */

    if(Math.abs(distance)<115 &&
       enemy.attackTimer<=0){

        enemy.attackTimer=1;

        if(!player.guard){

            player.hp-=8;
        }
    }


    /* NHẢY NGẪU NHIÊN */

    if(Math.random()<0.005 &&
       enemy.y<=0){

        enemy.vy=enemy.jumpPower;
    }


    enemy.vy-=1500*dt;
    enemy.y+=enemy.vy*dt;

    if(enemy.y<0){

        enemy.y=0;
        enemy.vy=0;
    }


    enemy.x =
        Math.max(40,
        Math.min(W-40,enemy.x));
}


/* =========================
   GAME UPDATE
========================= */

function updateGame(dt){

    updatePlayer(dt);
    updateEnemy(dt);

    if(player.hp<=0){

        player.hp=0;
        screen="menu";
    }

    if(enemy.hp<=0){

        enemy.hp=0;
        screen="menu";
    }

    updateButtons();
}


/* =========================
   VẼ NHÂN VẬT
========================= */

function drawFighter(f){

    const ground =
        H-150;

    const x=f.x;
    const y=
        ground-f.y-f.height;


    ctx.save();

    /* bóng */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground+5,
        40,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* thân */

    ctx.fillStyle =
        f.type==="speed"
        ? (f.mutated ? "#ff1744" : "#00bcd4")
        : (f.mutated ? "#9c27b0" : "#607d8b");

    ctx.fillRect(
        x-25,
        y+35,
        50,
        65
    );


    /* đầu */

    ctx.fillStyle="#f1c7a5";

    ctx.beginPath();

    ctx.arc(
        x,
        y+20,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* tóc */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        x,
        y+10,
        24,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* chân */

    ctx.fillStyle="#222";

    ctx.fillRect(
        x-20,
        y+100,
        15,
        35
    );

    ctx.fillRect(
        x+5,
        y+100,
        15,
        35
    );


    /* tay */

    ctx.fillStyle="#f1c7a5";

    ctx.fillRect(
        x-42,
        y+45,
        17,
        45
    );

    ctx.fillRect(
        x+25,
        y+45,
        17,
        45
    );


    /* hiệu ứng biến dị */

    if(f.mutated){

        ctx.strokeStyle="#ffea00";
        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            x,
            y+60,
            55,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /* đỡ */

    if(f.guard){

        ctx.strokeStyle="#ffffff";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.arc(
            x,
            y+55,
            65,
            -Math.PI/2,
            Math.PI/2
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* =========================
   THANH HP
========================= */

function drawBar(x,y,w,h,value,max,label){

    ctx.fillStyle="#222";

    ctx.fillRect(x,y,w,h);

    ctx.fillStyle="#e53935";

    ctx.fillRect(
        x,
        y,
        w*(value/max),
        h
    );

    ctx.strokeStyle="#fff";
    ctx.strokeRect(x,y,w,h);

    ctx.fillStyle="#fff";
    ctx.font="bold 14px Arial";

    ctx.fillText(
        label,
        x,
        y-5
    );
}


/* =========================
   NÚT
========================= */

function drawButton(b,text){

    ctx.fillStyle="rgba(40,40,40,.75)";

    ctx.beginPath();

    ctx.arc(
        b.x+b.w/2,
        b.y+b.h/2,
        b.w/2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="bold 15px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        b.x+b.w/2,
        b.y+b.h/2
    );

    ctx.textAlign="left";
    ctx.textBaseline="alphabetic";
}


/* =========================
   VẼ GAME
========================= */

function renderGame(){

    /* nền */

    ctx.fillStyle="#18202b";
    ctx.fillRect(0,0,W,H);


    /* sàn */

    ctx.fillStyle="#343434";

    ctx.fillRect(
        0,
        H-150,
        W,
        150
    );


    /* đường giữa */

    ctx.strokeStyle="#555";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(W/2,H-150);
    ctx.lineTo(W/2,H);

    ctx.stroke();


    /* HUD */

    drawBar(
        25,
        25,
        220,
        22,
        player.hp,
        player.maxHp,
        "PLAYER"
    );

    drawBar(
        W-245,
        25,
        220,
        22,
        enemy.hp,
        enemy.maxHp,
        "ENEMY"
    );


    /* thanh biến dị */

    ctx.fillStyle="#222";

    ctx.fillRect(
        25,
        65,
        220,
        15
    );

    ctx.fillStyle="#ffea00";

    ctx.fillRect(
        25,
        65,
        220*(player.mutation/100),
        15
    );


    /* thời gian biến dị */

    if(player.mutated){

        ctx.fillStyle="#fff";
        ctx.font="bold 18px Arial";

        ctx.fillText(
            "BIẾN DỊ: "+
            player.mutationTime.toFixed(1),
            25,
            110
        );
    }


    drawFighter(player);
    drawFighter(enemy);


    /* nút */

    drawButton(controls.left,"←");
    drawButton(controls.right,"→");

    drawButton(controls.jump,"↑");
    drawButton(controls.guard,"ĐỠ");
    drawButton(controls.attack,"ĐÁNH");

    drawButton(
        controls.skill1,
        player.skill1Timer>0
        ? player.skill1Timer.toFixed(1)
        : "S1"
    );

    drawButton(
        controls.skill2,
        player.skill2Timer>0
        ? player.skill2Timer.toFixed(1)
        : "S2"
    );

    if(player.mutation>=100){

        drawButton(
            controls.mutate,
            "BIẾN"
        );
    }
}


/* =========================
   MENU
========================= */

function renderMenu(){

    ctx.fillStyle="#10131a";
    ctx.fillRect(0,0,W,H);

    ctx.textAlign="center";

    ctx.fillStyle="#ffea00";
    ctx.font="bold 38px Arial";

    ctx.fillText(
        "ĐẤU TRƯỜNG",
        W/2,
        H*0.18
    );

    ctx.fillStyle="#00e5ff";

    ctx.fillText(
        "BIẾN DỊ",
        W/2,
        H*0.26
    );


    const bx=W/2-130;
    const bw=260;
    const bh=60;

    const buttons=[
        ["ĐẤU VỚI MÁY",H*0.35],
        ["ĐẤU VỚI NGƯỜI CHƠI",H*0.35+85],
        ["BOSS",H*0.35+170]
    ];


    buttons.forEach(item=>{

        ctx.fillStyle="#263238";

        ctx.fillRect(
            bx,
            item[1],
            bw,
            bh
        );

        ctx.strokeStyle="#00e5ff";
        ctx.lineWidth=2;

        ctx.strokeRect(
            bx,
            item[1],
            bw,
            bh
        );

        ctx.fillStyle="#fff";
        ctx.font="bold 18px Arial";

        ctx.fillText(
            item[0],
            W/2,
            item[1]+38
        );
    });


    ctx.textAlign="left";
}


/* =========================
   MAIN LOOP
========================= */

function loop(time){

    const dt =
        Math.min(
            (time-lastTime)/1000,
            0.033
        );

    lastTime=time;


    if(screen==="game"){

        updateGame(dt);
        renderGame();

    }else{

        renderMenu();
    }


    requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

</script>

</body>
      </html>

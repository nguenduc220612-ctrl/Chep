<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Đấu Trường Biến Dị</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#060711;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#070914;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   UI
========================= */

#ui{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.title{
  position:absolute;
  top:7px;
  left:0;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 8px #000;
}

.bars{
  position:absolute;
  left:4%;
  top:41px;
  width:92%;
  display:flex;
  gap:14px;
}

.box{
  width:50%;
}

.name{
  color:#fff;
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
  text-shadow:0 2px 5px #000;
}

.hp{
  height:16px;
  border:2px solid #666a7c;
  border-radius:20px;
  overflow:hidden;
  background:#222431;
}

.hp > div{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#a91d2d,#ff4153);
  transition:width .12s;
}

.rage{
  margin-top:4px;
  height:9px;
  border:1px solid #65687a;
  border-radius:20px;
  overflow:hidden;
  background:#1e2030;
}

.rage > div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7622d5,#d05cff);
}

#message{
  position:absolute;
  top:88px;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:14px;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:125px;
  z-index:20;
  pointer-events:none;
}

.group{
  position:absolute;
  bottom:4px;
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.left{ left:10px; }
.right{ right:10px; }

button{
  width:54px;
  height:56px;
  border:0;
  border-radius:17px;
  color:#fff;
  background:#303449;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 0 #11131d;
  touch-action:none;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #11131d;
}

.moveBtn{ background:#303952; }
.jump{ background:#2778b6; }
.attack{ background:#c52e40; }
.skill{ background:#7335c7; }
.power{ background:#ac4c20; }
.mutate{ background:#8439d6; }

.mutate.ready{
  animation:pulse .6s infinite alternate;
}

@keyframes pulse{
  from{
    box-shadow:0 0 5px #8f38dc,0 5px 0 #11131d;
  }
  to{
    box-shadow:0 0 24px #d568ff,0 5px 0 #11131d;
  }
}

/* =========================
   RESULT
========================= */

#resultScreen{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.78);
  z-index:30;
}

#result{
  color:#fff;
  font-size:35px;
  font-weight:900;
  margin-bottom:20px;
  text-align:center;
}

.restart{
  width:190px;
  background:#7837c8;
  font-size:16px;
}

@media(max-width:500px){
  .title{font-size:17px;}

  button{
    width:49px;
    height:53px;
    font-size:17px;
  }

  .bars{
    left:3%;
    width:94%;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="ui">

  <div class="title">⚡ ĐẤU TRƯỜNG BIẾN DỊ</div>

  <div class="bars">

    <div class="box">
      <div class="name">⚡ KẺ TỐC ĐỘ</div>

      <div class="hp">
        <div id="playerHP"></div>
      </div>

      <div class="rage">
        <div id="playerRage"></div>
      </div>
    </div>

    <div class="box">
      <div class="name" style="text-align:right">☠ BOSS</div>

      <div class="hp">
        <div id="bossHP"></div>
      </div>

      <div class="rage">
        <div id="bossRage"></div>
      </div>
    </div>

  </div>

  <div id="message">
    ⚡ Kẻ Tốc Độ bước vào đấu trường!
  </div>

</div>

<div class="controls">

  <div class="group left">

    <button
      class="moveBtn"
      ontouchstart="moveLeft()"
      ontouchend="stopMove()"
      onmousedown="moveLeft()"
      onmouseup="stopMove()">◀</button>

    <button
      class="moveBtn"
      ontouchstart="moveRight()"
      ontouchend="stopMove()"
      onmousedown="moveRight()"
      onmouseup="stopMove()">▶</button>

    <button class="jump" onclick="jump()">⬆</button>

  </div>

  <div class="group right">

    <button class="attack" onclick="attack()">👊</button>
    <button class="skill" onclick="dash()">💨</button>
    <button class="skill" onclick="afterImage()">⚡</button>
    <button class="power" onclick="breakSpeed()">💥</button>

    <button
      id="mutateButton"
      class="mutate"
      onclick="mutate()">🧬</button>

  </div>

</div>

<div id="resultScreen">

  <div id="result"></div>

  <button
    class="restart"
    onclick="restartGame()">🔄 CHƠI LẠI</button>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let dpr=1;

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   PLAYER
========================================================= */

let player={
  x:-2.8,
  y:0,
  vy:0,
  hp:100,
  rage:0,
  facing:1,
  action:"",
  actionTime:0,
  mutated:false,
  jump:false,
  hitFlash:0
};


/* =========================================================
   BOSS
========================================================= */

let boss={
  x:2.8,
  y:0,
  hp:100,
  rage:0,
  facing:-1,

  action:"",
  actionTime:0,

  mutated:false,
  hitFlash:0,

  state:"approach",
  stateTime:0,

  cooldown:0,
  dodgeCooldown:0,
  comboStep:0,

  enraged:false
};


let particles=[];
let speedLines=[];

let moveDirection=0;
let gameOver=false;

let hitStop=0;
let shake=0;

let last=performance.now();


/* =========================================================
   BASIC
========================================================= */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function rand(min,max){
  return Math.random()*(max-min)+min;
}

function distance(){
  return Math.abs(player.x-boss.x);
}

function say(text){
  document.getElementById("message").textContent=text;
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById("playerHP")
    .style.width=player.hp+"%";

  document.getElementById("bossHP")
    .style.width=boss.hp+"%";

  document.getElementById("playerRage")
    .style.width=player.rage+"%";

  document.getElementById("bossRage")
    .style.width=boss.rage+"%";

  const button=
    document.getElementById("mutateButton");

  if(player.rage>=100)
    button.classList.add("ready");
  else
    button.classList.remove("ready");
}


/* =========================================================
   INPUT
========================================================= */

function moveLeft(){
  if(gameOver)return;
  moveDirection=-1;
}

function moveRight(){
  if(gameOver)return;
  moveDirection=1;
}

function stopMove(){
  moveDirection=0;
}

function jump(){

  if(gameOver||player.jump)return;

  player.jump=true;
  player.vy=8.8;
}


/* =========================================================
   EFFECTS
========================================================= */

function burst(x,y,count,c1,c2){

  for(let i=0;i<count;i++){

    particles.push({
      x,
      y,
      vx:rand(-4,4),
      vy:rand(-2,5),
      life:rand(.25,.55),
      max:.55,
      size:rand(3,7),
      c:Math.random()<.5?c1:c2
    });
  }
}

function addSpeedLines(x,y){

  for(let i=0;i<3;i++){

    speedLines.push({
      x:x+rand(-.5,.5),
      y:y+rand(0,1.8),
      vx:rand(-10,-6),
      life:.25
    });
  }
}

function hitStopNow(ms=105){
  hitStop=ms;
  shake=9;
}


/* =========================================================
   DAMAGE
========================================================= */

function hitBoss(damage,knockback){

  boss.hp-=damage;

  player.rage=
    clamp(player.rage+damage*1.25,0,100);

  boss.rage=
    clamp(boss.rage+damage*.28,0,100);

  boss.x+=knockback;

  boss.x=clamp(boss.x,-6,6);

  boss.hitFlash=.18;

  burst(
    screenX(boss.x),
    screenY(1.4),
    18,
    "#ffffff",
    "#7d45ff"
  );

  hitStopNow();

  /* Boss ghi nhớ: vừa bị trúng */
  boss.state="react";
  boss.stateTime=.28;

  if(boss.hp<=0){
    boss.hp=0;
    win();
  }

  updateUI();
}


function hitPlayer(damage,knockback){

  player.hp-=damage;

  player.x+=knockback;

  player.x=clamp(player.x,-6,6);

  player.hitFlash=.18;

  player.rage=
    clamp(player.rage+damage*.65,0,100);

  burst(
    screenX(player.x),
    screenY(1.4),
    16,
    "#ffffff",
    "#ff4052"
  );

  hitStopNow();

  if(player.hp<=0){
    player.hp=0;
    lose();
  }

  updateUI();
}


/* =========================================================
   PLAYER ATTACKS
========================================================= */

function attack(){

  if(gameOver||player.action)return;

  player.action="punch";
  player.actionTime=.28;

  if(distance()<=1.9){

    setTimeout(()=>{

      if(!gameOver){
        hitBoss(
          player.mutated?18:10,
          player.facing*.45
        );

        say("👊 ĐÁNH TRÚNG!");
      }

    },95);

  }else{

    say("💨 Quá xa!");
  }
}


function dash(){

  if(gameOver||player.action)return;

  if(distance()>5){

    say("💨 Boss quá xa!");
    return;
  }

  player.action="dash";
  player.actionTime=.35;

  player.x=boss.x-player.facing*.95;

  player.x=clamp(player.x,-6,6);

  addSpeedLines(
    screenX(player.x),
    screenY(1)
  );

  say("💨 LƯỚT XUYÊN!");

  setTimeout(()=>{

    if(!gameOver && distance()<=1.8){

      hitBoss(
        player.mutated?25:15,
        player.facing*.8
      );
    }

  },80);
}


function afterImage(){

  if(gameOver||player.action)return;

  if(distance()>2.6){

    say("⚡ Hãy áp sát!");
    return;
  }

  player.action="after";
  player.actionTime=.38;

  say("⚡ ẢNH TỐC!");

  for(let i=0;i<5;i++){

    setTimeout(()=>{

      addSpeedLines(
        screenX(player.x)-i*12,
        screenY(1)
      );

    },i*35);
  }

  setTimeout(()=>{

    if(!gameOver && distance()<=2){

      hitBoss(
        player.mutated?28:17,
        player.facing*.5
      );
    }

  },100);
}


function breakSpeed(){

  if(gameOver||player.action)return;

  if(distance()>2){

    say("💥 Quá xa!");
    return;
  }

  player.action="break";
  player.actionTime=.48;

  say("💥 PHÁ TỐC!");

  setTimeout(()=>{

    if(!gameOver && distance()<=2.2){

      hitBoss(
        player.mutated?40:25,
        player.facing*1.15
      );
    }

  },135);
}


/* =========================================================
   PLAYER MUTATION
========================================================= */

function mutate(){

  if(gameOver)return;

  if(player.rage<100){

    say("🧬 NỘI CHƯA ĐẦY!");
    return;
  }

  if(player.mutated){

    say("🔥 Đang biến dị!");
    return;
  }

  player.rage=0;
  player.mutated=true;

  player.action="transform";
  player.actionTime=.6;

  burst(
    screenX(player.x),
    screenY(1.5),
    45,
    "#ffffff",
    "#b348ff"
  );

  say("🧬 KẺ TỐC ĐỘ — BIẾN DỊ!");

  updateUI();

  setTimeout(()=>{
    player.action="";
  },600);

  setTimeout(()=>{

    player.mutated=false;
    say("↩️ Biến dị kết thúc!");

  },8000);
}


/* =========================================================
   BOSS AI - CORE
========================================================= */

function bossAI(dt){

  if(gameOver)return;

  /* cooldown */

  if(boss.cooldown>0)
    boss.cooldown-=dt;

  if(boss.dodgeCooldown>0)
    boss.dodgeCooldown-=dt;


  /* enraged */

  if(
    !boss.enraged &&
    boss.hp<=35
  ){

    boss.enraged=true;

    say("😡 BOSS PHÁT ĐIÊN!");

    burst(
      screenX(boss.x),
      screenY(1.4),
      28,
      "#ff4d63",
      "#ff9b4d"
    );
  }


  const d=distance();

  /* hướng */

  boss.facing =
    player.x>=boss.x ? 1:-1;


  /* =====================================
     REACT
  ===================================== */

  if(boss.state==="react"){

    boss.stateTime-=dt;

    if(boss.stateTime<=0){

      boss.state="decide";
      boss.stateTime=.15;
    }

    return;
  }


  /* =====================================
     DODGE
  ===================================== */

  /*
     Nếu player vừa dùng skill
     và boss còn dodge cooldown
  */

  if(
    (player.action==="dash" ||
     player.action==="after" ||
     player.action==="break") &&

    d<2.5 &&

    boss.dodgeCooldown<=0 &&

    Math.random()<(
      boss.mutated ? .60 : .38
    )
  ){

    bossDodge();
    return;
  }


  /* =====================================
     GUARD
  ===================================== */

  if(
    player.action==="punch" &&
    d<2.2 &&
    !boss.action &&
    Math.random()<(
      boss.enraged?.22:.38
    )
  ){

    bossGuard();
    return;
  }


  /* =====================================
     KEEP DISTANCE
  ===================================== */

  if(d<1.25 && !player.action){

    /*
      Có lúc lùi một chút
      thay vì dí sát vô hạn
    */

    if(Math.random()<.35){

      boss.x-=
        boss.facing*
        .6;

      return;
    }
  }


  /* =====================================
     APPROACH
  ===================================== */

  if(d>2.2){

    const speed =
      boss.enraged
        ? 2.4
        : boss.mutated
          ? 2.15
          : 1.55;

    boss.x+=
      boss.facing*
      speed*
      dt;

    boss.x=clamp(boss.x,-6,6);

    if(
      Math.random()<
      (boss.mutated?.18:.10)
    ){

      addSpeedLines(
        screenX(boss.x),
        screenY(.9)
      );
    }

    return;
  }


  /* =====================================
     DECISION
  ===================================== */

  if(
    !boss.action &&
    boss.cooldown<=0
  ){

    chooseBossAttack(d);
  }


  /* =====================================
     RAGE / MUTATION
  ===================================== */

  if(
    boss.rage>=100 &&
    !boss.mutated
  ){

    boss.rage=0;

    boss.mutated=true;

    boss.cooldown=.25;

    burst(
      screenX(boss.x),
      screenY(1.5),
      38,
      "#ff5268",
      "#80152e"
    );

    say("☠️ BOSS ĐÃ BIẾN DỊ!");

    setTimeout(()=>{

      boss.mutated=false;

      say("Boss trở lại bình thường!");

    },8000);
  }
}


/* =========================================================
   BOSS DECISION
========================================================= */

function chooseBossAttack(d){

  const roll=Math.random();

  /*
     Khoảng gần:
     combo / heavy / guard bait
  */

  if(d<=1.65){

    if(roll<.42){

      bossCombo();

    }else if(roll<.68){

      bossHeavy();

    }else{

      bossSideStep();
    }

    return;
  }


  /*
     Khoảng vừa:
     lao tới hoặc chờ
  */

  if(d<=2.25){

    if(roll<.45){

      bossLunge();

    }else if(roll<.70){

      bossCombo();

    }else{

      bossWait();
    }

    return;
  }


  bossLunge();
}


/* =========================================================
   BOSS WAIT
========================================================= */

function bossWait(){

  boss.state="wait";
  boss.stateTime=.35;

  boss.cooldown=
    boss.enraged ? .25:.45;
}


/* =========================================================
   BOSS GUARD
========================================================= */

function bossGuard(){

  if(boss.action)return;

  boss.action="guard";
  boss.actionTime=.38;

  boss.state="guard";

  say("🛡️ BOSS ĐỠ ĐÒN!");

  boss.cooldown=
    boss.enraged ? .3:.55;

  setTimeout(()=>{

    if(
      !gameOver &&
      distance()<=2.1 &&
      player.action
    ){

      /*
        Guard chỉ giảm sát thương
        nếu đòn thực sự chạm
      */

      player.action="";

      say("☠️ Boss phản đòn!");

      setTimeout(()=>{
        bossCounter();
      },90);
    }

  },160);
}


/* =========================================================
   BOSS DODGE
========================================================= */

function bossDodge(){

  boss.action="dodge";
  boss.actionTime=.28;

  boss.dodgeCooldown=
    boss.mutated ? 1.0:1.8;

  const side=
    player.x>=boss.x ? -1:1;

  boss.x+=side*(boss.mutated?1.15:.8);

  boss.x=clamp(boss.x,-6,6);

  say("💨 BOSS NÉ!");

  addSpeedLines(
    screenX(boss.x),
    screenY(1)
  );

  boss.cooldown=.18;
}


/* =========================================================
   BOSS SIDE STEP
========================================================= */

function bossSideStep(){

  boss.action="dodge";
  boss.actionTime=.25;

  const side=
    Math.random()<.5 ? -1:1;

  boss.x+=side*.7;

  boss.x=clamp(boss.x,-6,6);

  boss.dodgeCooldown=
    boss.mutated?0.8:1.5;

  boss.cooldown=.3;
}


/* =========================================================
   BOSS LUNGE
========================================================= */

function bossLunge(){

  if(boss.action)return;

  boss.action="lunge";
  boss.actionTime=.34;

  boss.cooldown=
    boss.enraged ? .42 :
    boss.mutated ? .48 :
    .75;

  const dir=
    player.x>=boss.x ? 1:-1;

  boss.facing=dir;

  boss.x+=
    dir*
    (boss.mutated?1.0:.7);

  say("☠️ BOSS LAO TỚI!");

  setTimeout(()=>{

    if(
      !gameOver &&
      distance()<=1.75
    ){

      const damage=
        boss.mutated
          ? 15
          : boss.enraged
            ? 12
            : 8;

      hitPlayer(
        damage,
        dir*.45
      );
    }

  },110);
}


/* =========================================================
   BOSS COMBO
========================================================= */

function bossCombo(){

  if(boss.action)return;

  boss.action="combo";

  boss.comboStep=0;

  const total=
    boss.mutated ? 3 :
    boss.enraged ? 3 :
    2;

  boss.cooldown=
    boss.enraged ? .55 :
    boss.mutated ? .65 :
    .9;

  say("☠️ BOSS COMBO!");

  for(let i=0;i<total;i++){

    setTimeout(()=>{

      if(
        gameOver ||
        distance()>2.0
      )return;

      boss.comboStep=i+1;

      const damage=
        boss.mutated
          ? (i===total-1?12:6)
          : (i===total-1?9:5);

      hitPlayer(
        damage,
        boss.facing*.18
      );

    },100+i*155);
  }

  setTimeout(()=>{

    boss.action="";

  },100+total*155+120);
}


/* =========================================================
   BOSS HEAVY ATTACK
========================================================= */

function bossHeavy(){

  if(boss.action)return;

  boss.action="heavy";
  boss.actionTime=.55;

  boss.cooldown=
    boss.enraged ? .7:.95;

  say("💥 BOSS PHÁ ĐÒN!");

  setTimeout(()=>{

    if(
      !gameOver &&
      distance()<=2.0
    ){

      hitPlayer(
        boss.mutated?22:15,
        boss.facing*.7
      );

      bossRageFx();
    }

  },210);

  setTimeout(()=>{

    boss.action="";

  },550);
}


/* =========================================================
   BOSS COUNTER
========================================================= */

function bossCounter(){

  if(gameOver)return;

  boss.action="counter";
  boss.actionTime=.35;

  boss.cooldown=.6;

  if(distance()<=2.0){

    hitPlayer(
      boss.mutated?17:11,
      boss.facing*.4
    );

    say("⚡ BOSS PHẢN CÔNG!");
  }

  setTimeout(()=>{

    boss.action="";

  },350);
}


function bossRageFx(){

  burst(
    screenX(boss.x),
    screenY(1.2),
    14,
    "#ff7b39",
    "#ff2e52"
  );
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

  if(gameOver)return;

  if(moveDirection!==0){

    player.x+=
      moveDirection*
      3.8*
      dt;

    player.x=
      clamp(player.x,-6,6);

    player.facing=
      moveDirection;

    if(!player.action){

      addSpeedLines(
        screenX(player.x),
        screenY(.8)
      );
    }
  }


  if(player.jump){

    player.y+=player.vy*dt;
    player.vy-=18*dt;

    if(player.y<=0){

      player.y=0;
      player.vy=0;
      player.jump=false;
    }
  }


  if(player.actionTime>0){

    player.actionTime-=dt;

    if(player.actionTime<=0)
      player.action="";
  }


  if(player.hitFlash>0)
    player.hitFlash-=dt;
}


/* =========================================================
   BOSS ANIMATION TIMER
========================================================= */

function updateBossTimers(dt){

  if(boss.actionTime>0){

    boss.actionTime-=dt;

    if(boss.actionTime<=0){

      if(
        boss.action!=="combo" &&
        boss.action!=="guard"
      ){

        boss.action="";
      }
    }
  }

  if(boss.stateTime>0)
    boss.stateTime-=dt;

  if(boss.hitFlash>0)
    boss.hitFlash-=dt;
}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy-=8*dt;
    p.life-=dt;

    if(p.life<=0)
      particles.splice(i,1);
  }


  for(
    let i=speedLines.length-1;
    i>=0;
    i--
  ){

    const s=speedLines[i];

    s.x+=s.vx*dt;
    s.life-=dt;

    if(s.life<=0)
      speedLines.splice(i,1);
  }


  shake*=.86;
}


/* =========================================================
   WORLD
========================================================= */

function getCamera(){

  return (player.x+boss.x)/2;
}

function worldToScreen(x){

  const cam=getCamera();

  return W*.5+(x-cam)*W*.105;
}

function screenX(x){
  return worldToScreen(x);
}

function screenY(y){

  return H*.70-y*H*.14;
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(0,"#070916");
  sky.addColorStop(.5,"#18143a");
  sky.addColorStop(1,"#05060d");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);


  const glow=
    ctx.createRadialGradient(
      W*.5,H*.27,10,
      W*.5,H*.27,260
    );

  glow.addColorStop(
    0,
    "rgba(126,65,255,.22)"
  );

  glow.addColorStop(
    1,
    "rgba(126,65,255,0)"
  );

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);


  ctx.fillStyle="#101124";

  for(let i=0;i<16;i++){

    const bw=45+(i%4)*18;
    const bh=70+(i%5)*24;
    const x=i*bw-20;

    ctx.fillRect(
      x,
      H*.54-bh,
      bw-7,
      bh
    );
  }


  ctx.fillStyle="rgba(120,145,255,.18)";

  for(let i=0;i<30;i++){

    const x=(i*83)%W;
    const y=H*.35+(i%6)*24;

    ctx.fillRect(x,y,5,8);
  }
}


/* =========================================================
   ARENA
========================================================= */

function drawArena(){

  const groundY=H*.70;

  ctx.fillStyle="#252638";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );


  ctx.strokeStyle=
    "rgba(120,120,160,.12)";

  ctx.lineWidth=1;

  for(let x=-W;x<W*2;x+=55){

    ctx.beginPath();

    ctx.moveTo(x,groundY);
    ctx.lineTo(x+15,H);

    ctx.stroke();
  }


  for(
    let y=groundY+30;
    y<H;
    y+=38
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }


  ctx.fillStyle="#66677b";

  ctx.fillRect(
    0,
    groundY-5,
    W,
    5
  );


  const g=
    ctx.createRadialGradient(
      W*.5,
      groundY,
      10,
      W*.5,
      groundY,
      W*.25
    );

  g.addColorStop(
    0,
    "rgba(150,80,255,.16)"
  );

  g.addColorStop(
    1,
    "rgba(150,80,255,0)"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    groundY-100,
    W,
    220
  );
}


/* =========================================================
   CHARACTER
========================================================= */

function drawCharacter(ch,isBoss){

  const x=worldToScreen(ch.x);
  const ground=H*.70;
  const y=ground-ch.y*H*.14;

  ctx.save();

  /* shadow */

  ctx.globalAlpha=.28;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    ground+7,
    34,
    10,
    0,0,Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* aura */

  if(ch.mutated){

    const aura=
      ctx.createRadialGradient(
        x,y-52,8,
        x,y-52,75
      );

    aura.addColorStop(
      0,
      isBoss
        ? "rgba(255,40,75,.28)"
        : "rgba(173,60,255,.34)"
    );

    aura.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=aura;

    ctx.beginPath();

    ctx.arc(
      x,y-52,75,
      0,Math.PI*2
    );

    ctx.fill();
  }


  let bodyW=42;
  let bodyH=65;

  if(ch.mutated){
    bodyW=48;
    bodyH=72;
  }


  /* legs */

  drawLimb(
    x-13,y-8,
    x-17,y+34,
    isBoss?"#28212b":"#161b2c",
    12
  );

  drawLimb(
    x+13,y-8,
    x+17,y+34,
    isBoss?"#28212b":"#161b2c",
    12
  );


  drawBoot(
    x-20,y+31,
    isBoss?"#4d1822":"#1c3255"
  );

  drawBoot(
    x+20,y+31,
    isBoss?"#4d1822":"#1c3255"
  );


  /* torso */

  const torso=
    ctx.createLinearGradient(
      x-bodyW/2,y-76,
      x+bodyW/2,y-10
    );

  if(isBoss){

    torso.addColorStop(0,"#8f2138");
    torso.addColorStop(.5,"#c7354d");
    torso.addColorStop(1,"#571827");

  }else{

    torso.addColorStop(0,"#141b2d");
    torso.addColorStop(.5,"#243756");
    torso.addColorStop(1,"#0a101d");
  }

  ctx.fillStyle=torso;

  roundRect(
    ctx,
    x-bodyW/2,
    y-84,
    bodyW,
    bodyH,
    14
  );

  ctx.fill();


  /* chest symbol */

  if(!isBoss){

    ctx.save();

    ctx.fillStyle=
      ch.mutated
        ? "#d76cff"
        : "#ffd227";

    ctx.shadowBlur=
      ch.mutated ? 18:8;

    ctx.shadowColor=
      ch.mutated
        ? "#ad48ff"
        : "#ffd227";

    ctx.beginPath();

    ctx.moveTo(x,y-70);
    ctx.lineTo(x+8,y-54);
    ctx.lineTo(x+2,y-54);
    ctx.lineTo(x+9,y-34);
    ctx.lineTo(x-4,y-51);
    ctx.lineTo(x+1,y-51);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }


  /* attack pose */

  let punchOffset=0;

  if(ch.action==="punch")
    punchOffset=27;

  if(ch.action==="heavy" ||
     ch.action==="break")
    punchOffset=35;

  if(ch.action==="dash")
    punchOffset=18;

  if(ch.action==="counter")
    punchOffset=30;


  /* arms */

  drawLimb(
    x-24,y-70,
    x-40,y-34,
    isBoss?"#d08f69":"#e7ac7c",
    13
  );

  drawLimb(
    x+24,y-70,
    x+40+(punchOffset*ch.facing),
    y-36,
    isBoss?"#d08f69":"#e7ac7c",
    13
  );


  drawSphere(
    x-42,
    y-31,
    11,
    isBoss?"#501b27":"#23385d"
  );

  drawSphere(
    x+42+(punchOffset*ch.facing),
    y-32,
    11,
    isBoss?"#501b27":"#23385d"
  );


  /* neck */

  ctx.fillStyle=
    isBoss?"#bb815f":"#d9996c";

  ctx.fillRect(
    x-8,
    y-96,
    16,
    13
  );


  /* head */

  const head=
    ctx.createRadialGradient(
      x-8,y-112,5,
      x,y-104,30
    );

  head.addColorStop(
    0,
    isBoss?"#dcab86":"#ffd0a5"
  );

  head.addColorStop(
    1,
    isBoss?"#8f5c46":"#c47f5f"
  );

  ctx.fillStyle=head;

  ctx.beginPath();

  ctx.arc(
    x,
    y-108,
    27,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  if(!isBoss){

    ctx.fillStyle=
      ch.mutated?"#c35dff":"#141927";

    ctx.beginPath();

    ctx.moveTo(x-27,y-111);
    ctx.lineTo(x-20,y-137);
    ctx.lineTo(x-7,y-128);
    ctx.lineTo(x+3,y-145);
    ctx.lineTo(x+10,y-127);
    ctx.lineTo(x+28,y-138);
    ctx.lineTo(x+20,y-108);
    ctx.closePath();

    ctx.fill();

  }else{

    ctx.fillStyle=
      ch.mutated?"#7a091e":"#4d1725";

    ctx.beginPath();

    ctx.moveTo(x-27,y-111);

    ctx.quadraticCurveTo(
      x-20,y-140,
      x+4,y-132
    );

    ctx.quadraticCurveTo(
      x+21,y-140,
      x+27,y-111
    );

    ctx.closePath();

    ctx.fill();
  }


  /* eyes */

  ctx.fillStyle=
    ch.mutated
      ? "#fff"
      : "#111";

  ctx.fillRect(
    x-15,
    y-109,
    8,
    4
  );

  ctx.fillRect(
    x+7,
    y-109,
    8,
    4
  );


  /* dodge aura */

  if(ch.action==="dodge"){

    ctx.strokeStyle=
      isBoss
        ? "rgba(255,65,95,.65)"
        : "rgba(130,80,255,.65)";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      x,y-70,
      55,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }


  /* guard */

  if(ch.action==="guard"){

    ctx.strokeStyle="#62b7ff";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
      x,y-67,
      50,
      Math.PI*1.05,
      Math.PI*1.95
    );

    ctx.stroke();
  }


  /* hit flash */

  if(ch.hitFlash>0){

    ctx.globalAlpha=
      clamp(ch.hitFlash/.18,0,1);

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      x,
      y-74,
      53,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
  }


  /* speed trails */

  if(
    ch.action==="dash" ||
    ch.action==="after" ||
    ch.action==="lunge"
  ){

    for(let i=0;i<5;i++){

      ctx.strokeStyle=
        isBoss
          ? "rgba(255,60,90,.35)"
          : "rgba(119,79,255,.45)";

      ctx.lineWidth=3;

      ctx.beginPath();

      const sx=
        x-ch.facing*(30+i*15);

      ctx.moveTo(
        sx,
        y-60+i*9
      );

      ctx.lineTo(
        sx-ch.facing*35,
        y-60+i*9
      );

      ctx.stroke();
    }
  }


  ctx.restore();
}


/* =========================================================
   HELPERS
========================================================= */

function drawLimb(
  x1,y1,x2,y2,color,width
){

  const dx=x2-x1;
  const dy=y2-y1;
  const len=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx);

  ctx.save();

  ctx.translate(x1,y1);
  ctx.rotate(ang);

  const grad=
    ctx.createLinearGradient(
      0,-width/2,
      0,width/2
    );

  grad.addColorStop(
    0,
    "#ffffff55"
  );

  grad.addColorStop(
    .25,
    color
  );

  grad.addColorStop(
    1,
    "#00000055"
  );

  ctx.fillStyle=grad;

  roundRect(
    ctx,
    0,
    -width/2,
    len,
    width,
    width/2
  );

  ctx.fill();

  ctx.restore();
}


function drawBoot(x,y,color){

  const grad=
    ctx.createLinearGradient(
      x-12,y-10,
      x+14,y+8
    );

  grad.addColorStop(0,"#ffffff33");
  grad.addColorStop(.35,color);
  grad.addColorStop(1,"#00000088");

  ctx.fillStyle=grad;

  roundRect(
    ctx,
    x-11,
    y-9,
    25,
    17,
    6
  );

  ctx.fill();
}


function drawSphere(x,y,r,color){

  const grad=
    ctx.createRadialGradient(
      x-r*.4,
      y-r*.5,
      2,
      x,
      y,
      r
    );

  grad.addColorStop(0,"#ffffff77");
  grad.addColorStop(.25,color);
  grad.addColorStop(1,"#00000099");

  ctx.fillStyle=grad;

  ctx.beginPath();

  ctx.arc(
    x,y,r,
    0,Math.PI*2
  );

  ctx.fill();
}


function roundRect(
  ctx,x,y,w,h,r
){

  r=Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}


/* =========================================================
   EFFECT DRAW
========================================================= */

function drawEffects(){

  for(const p of particles){

    ctx.globalAlpha=
      clamp(p.life/p.max,0,1);

    ctx.fillStyle=p.c;

    ctx.beginPath();

    ctx.arc(
      screenX(p.x),
      screenY(p.y),
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;


  for(const s of speedLines){

    ctx.globalAlpha=
      clamp(s.life/.25,0,1);

    ctx.strokeStyle="#a85cff";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      worldToScreen(s.x),
      screenY(s.y)
    );

    ctx.lineTo(
      worldToScreen(s.x+.7),
      screenY(s.y)
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  ctx.save();

  if(shake>.2){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );
  }

  drawBackground();
  drawArena();

  if(player.x<boss.x){

    drawCharacter(
      player,
      false
    );

    drawCharacter(
      boss,
      true
    );

  }else{

    drawCharacter(
      boss,
      true
    );

    drawCharacter(
      player,
      false
    );
  }

  drawEffects();

  ctx.restore();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  if(hitStop>0){

    hitStop-=dt*1000;

  }else{

    updatePlayer(dt);
    updateBossTimers(dt);
    bossAI(dt);
    updateParticles(dt);
  }

  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   WIN / LOSE
========================================================= */

function win(){

  gameOver=true;

  say("🏆 KẺ TỐC ĐỘ CHIẾN THẮNG!");

  document.getElementById("result")
    .textContent="🏆 CHIẾN THẮNG!";

  document.getElementById("resultScreen")
    .style.display="flex";
}


function lose(){

  gameOver=true;

  say("💀 Bạn đã bị đánh bại!");

  document.getElementById("result")
    .textContent="💀 THẤT BẠI";

  document.getElementById("resultScreen")
    .style.display="flex";
}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

  player.x=-2.8;
  player.y=0;
  player.vy=0;
  player.hp=100;
  player.rage=0;
  player.facing=1;
  player.action="";
  player.actionTime=0;
  player.mutated=false;
  player.jump=false;
  player.hitFlash=0;


  boss.x=2.8;
  boss.y=0;
  boss.hp=100;
  boss.rage=0;
  boss.facing=-1;
  boss.action="";
  boss.actionTime=0;
  boss.mutated=false;
  boss.hitFlash=0;

  boss.state="approach";
  boss.stateTime=0;
  boss.cooldown=0;
  boss.dodgeCooldown=0;
  boss.comboStep=0;
  boss.enraged=false;


  particles=[];
  speedLines=[];

  moveDirection=0;
  gameOver=false;
  hitStop=0;
  shake=0;

  document.getElementById(
    "resultScreen"
  ).style.display="none";

  say("⚡ Kẻ Tốc Độ trở lại!");

  updateUI();
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft();

    if(e.key==="ArrowRight")
      moveRight();

    if(e.key==="ArrowUp")
      jump();

    if(e.key==="z")
      attack();

    if(e.key==="x")
      dash();

    if(e.key==="c")
      afterImage();

    if(e.key==="v")
      breakSpeed();

    if(e.key==="b")
      mutate();
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight"
    ){

      stopMove();
    }
  }
);


/* =========================================================
   START
========================================================= */

updateUI();

say("⚡ Kẻ Tốc Độ bước vào đấu trường!");

</script>
